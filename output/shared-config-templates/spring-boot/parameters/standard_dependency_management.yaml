- title: Spring Boot - Dependency Management
  required: []
  properties:
    dependencies:
      type: object
      title: Service Dependencies
      properties:
        spring_web:
          type: boolean
          default: true
          title: "Spring Web"
          description: "Spring Boot Starter Web for REST API development"
          ui:help: "Active les contrôleurs REST et le serveur HTTP embarqué"

        spring_cloud:
          type: boolean
          default: false
          title: "Spring Cloud"
          description: "Spring Cloud for distributed system patterns"

        open_feign:
          type: boolean
          default: false
          title: "Open Feign Client"
          ui:help: "Simplifie la communication entre microservices avec Feign et Resilience4j"

        sftp:
          type: boolean
          default: false
          title: "SFTP Support"
          description: "Spring Integration SFTP"

        cloud_file_storage_client:
          type: boolean
          default: false
          title: "Cloud File Storage Client"

        notification_client:
          type: boolean
          default: false
          title: "Notification Client"

        business_event_publisher:
          type: boolean
          default: false
          title: "Business Event Publisher"

        technical_message_consumer:
          type: boolean
          default: false
          title: "SQS Consumer"

        business_event_consumer:
          type: boolean
          default: false
          title: "Solace Consumer"

        technical_message_publisher:
          type: object
          title: "Technical Message Publisher"
          properties:
            publisher_type:
              type: string
              enum: ["NONE", "SQS", "SNS"]
              default: "NONE"
              ui:help: "Type de file d'attente technique (SQS ou SNS)"

        business_event_consumer_legacy:
          type: boolean
          default: false
          title: "Business Event Consumer (Solace)"

        graphQL:
          type: boolean
          default: false
          title: "GraphQL"
          description: "Spring Boot GraphQL support"

        auth:
          type: object
          title: "Authentication"
          properties:
            auth_type:
              type: string
              enum: ["None", "Azure", "Ping Federate", "Azure and Ping Federate"]
              default: "None"
              ui:help: "Type d'authentification pour le service"

        cache:
          type: object
          title: "Caching"
          properties:
            cache_type:
              type: string
              enum: ["None", "Redis", "Caffeine"]
              default: "None"
              ui:help: "Type de cache pour les données"

        database:
          type: object
          title: "Database"
          properties:
            database_type:
              type: string
              enum: ["Not Applicable", "Postgres", "Oracle"]
              default: "Postgres"
              ui:help: "Type de base de données relationnelle"

    openapi_specification:
      type: object
      title: "OpenAPI Specification"
      properties:
        swagger_path:
          type: string
          default: ""
          title: "OpenAPI Spec URL"
          description: "URL of the OpenAPI specification for code generation"
          ui:help: "URL du fichier spec OpenAPI/Swagger (GitLab/raw, etc.)"

        swagger_file_name:
          type: string
          default: ""
          title: "Swagger File Name"
          ui:help: "Nom du fichier Swagger pour la documentation Backstage"

    swagger_info:
      type: object
      properties:
        swagger_file_name:
          type: string
          default: ""
          ui:help: "Nom du fichier Swagger pour enregistrement dans Backstage"
