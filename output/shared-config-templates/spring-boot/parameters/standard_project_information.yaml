- title: Spring Boot - Project Information
  required:
    - group_id
    - artifact_id
    - description
    - java_version
    - java_package_name
  properties:
    group_id:
      title: Group ID
      type: string
      description: Maven Group ID for your project
      default: "com.cma"
      ui:help: "Identifiant Maven du groupe. Ex: com.cma"
      ui:autocomplete: "off"

    artifact_id:
      title: Artifact ID
      type: string
      description: "Name your service here; this will be used as its unique identifier"
      ui:help: "Hint: sample-api"
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      errorMessage: "Invalid Artifact ID. Use lowercase letters and numbers only. Hyphens are allowed only between segments."
      ui:autocomplete: "off"

    description:
      title: Description
      type: string
      description: A concise summary of what your service does.
      ui:help: "Une phrase décrivant le service. Apparaîtra dans le Catalog."
      ui:autocomplete: "off"

    java_version:
      title: Java Version
      type: string
      description: The Java version to be used for compiling and running your project
      enum:
        - "17"
        - "21"
      enumNames:
        - "Java 17 LTS"
        - "Java 21 LTS"
      default: "21"
      ui:help: "Version Java du serveur de runtime."
      ui:options:
        openEnum: true

    java_package_name:
      title: Java Package Name
      type: string
      description: Base package name for Java classes
      default: "com.cma"
      ui:help: "Nom du package Java. Ex: com.cma.pricing"
      ui:autocomplete: "off"

    spring_boot_version:
      title: Spring Boot Version
      type: string
      description: The Spring Boot version
      default: "3.4.2"
      ui:help: "Version de Spring Boot. Consultez les versions supportées sur spring.io"
      ui:autocomplete: "off"

    spring_cloud_version:
      title: Spring Cloud Version
      type: string
      description: The Spring Cloud version
      default: "2024.0.0"
      ui:help: "Version de Spring Cloud."
      ui:autocomplete: "off"
