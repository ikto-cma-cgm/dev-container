- id: create_microservice_repo
  name: Create Microservice Repository
  action: publish:github
  input:
    allowedHosts: ['github.com']
    repoUrl: github.com?owner=cma-cgm&repo=${{ parameters.artifact_id }}
    description: ${{ parameters.description }}

- id: fetch_cma_cicd_config
  name: Fetch CMA CICD Config
  action: fetch:template
  input:
    url: ./shared-config-templates/spring-boot/cicd/spring-boot-microservice
    targetPath: ./app/cicd
