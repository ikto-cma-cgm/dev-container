- title: GitLab Information
  required:
    - architecture_area
    - gitlab_namespace
    - docker_image_prefix
  properties:
    architecture_area:
      title: Architecture Area
      type: string
      description: "Architecture area in GitLab (e.g., shipping, finance, platform)"
      ui:help: "Domaine d'architecture métier. Ex: finance, shipping, platform"
      ui:autocomplete: "off"

    gitlab_namespace:
      title: GitLab Namespace
      type: string
      description: "GitLab namespace/project group for repository creation"
      ui:help: "Espace de noms GitLab pour le projet. Ex: pricing-services"
      ui:autocomplete: "off"

    docker_image_prefix:
      title: Docker Image Prefix
      type: string
      description: "Prefix for Docker image repository path"
      ui:help: "Préfixe du registry Docker. Ex: eu.gcr.io/cma-cgm"
      default: "eu.gcr.io/cma-cgm"
      ui:autocomplete: "off"
