apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.artifact_id}}
  title: ${{values.artifact_id}}
  description: ${{values.description}}
  annotations:
    backstage.io/techdocs-ref: dir:.
    simpleicons.org/icon-slug: springboot
    sonarqube.org/project-key: ${{values.group_id}}:${{values.artifact_id}}
    backstage.io/source-template: template:default/spring-boot-base-template
    jenkins.io/job-full-name: ${{values.jenkins_job_url}}
spec:
  type: service
  lifecycle: experimental
  owner: ${{values.owner | dump}}
  system: ${{values.system}}