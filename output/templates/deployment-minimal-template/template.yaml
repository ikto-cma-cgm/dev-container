apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deployment-minimal-template
  title: Deployment Minimal Template
  description: >
    Minimal Kubernetes deployment artifacts for Camunda adapters. Includes deployment, service,
    configmap, secrets, ingress, HPA, PDB, CNP, and RBAC resources.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - application
    - kubernetes
    - deployment
spec:
  type: service
  owner: group:default/it-development-software-engineering-developer-platform
  parameters:
    - title: Service identity
      required: [name, description, owner]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:help: 'Kebab-case, unique in the Catalog. Ex: booking-api'
        description:
          title: Description
          type: string
          ui:help: 'One-line description of the service.'
        owner:
          title: Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Team responsible for this service.'
    - title: Deployment Configuration
      required: [projectName, application]
      properties:
        projectName:
          title: Project Name
          type: string
          ui:help: 'Service artifact ID for the deployment resources.'
        application:
          title: Application Path
          type: string
          ui:help: 'GitLab application path (architectureArea/namespace).'
  steps:
    - id: fetch-deployment-skeleton
      name: Fetch deployment skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          project_name: ${{ parameters.projectName }}
          application: ${{ parameters.application }}
  output:
    links:
      - title: Deployment Resources
        icon: docs
        url: ./resources/README.md
    text:
      - title: Deployment Resources Created
        content: |
          Minimal Kubernetes deployment resources for **${{ parameters.projectName }}**.
