apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{values.project_name}}
  namespace: {{k8s.namespace}}
  annotations:
    role: application service account
    privileges: ${{values.project_name}}
    {% if (values.cloud_file_storage_client) or (values.technical_message_publisher) or (values.technical_message_consumer) -%}
		eks.amazonaws.com/role-arn: {{adapter.iam.role.arn}}
		{%- endif %}
