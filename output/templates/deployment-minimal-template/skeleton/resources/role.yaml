apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{values.project_name}}
  namespace: {{k8s.namespace}}
###ENDPOINTS
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - list
  - watch
###SERVICES
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
###PODS
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
###CONFIGMAPS
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
###SECRETS
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - "${{values.project_name}}"
  verbs:
  - get
  - watch
  - list
