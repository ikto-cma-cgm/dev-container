apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{values.project_name}}
  namespace: {{k8s.namespace}}
data:
  application.yaml: |-
     spring:
       application:
          name: ${{values.project_name}}
     management:
      metrics:
        enable:
          all: false
          case: true # We only enable metrics related to our use case which is here case (other metrics can be enable e.g. jvm: true, tomcat: true to list them set all: true)
          zeebe: true
        registry:
          #active: cloudwatch
          cloudwatch:
            batch-size: 20
            step-in-seconds: 30
            namespace: ${app.cma.project-name}
        tags:
          project: ${app.cma.project-name} # here should be mentionned the global project name
          app: ${spring.application.name}
      endpoints:
        web:
          exposure:
            include: metrics
     camunda:
       client:
         cluster-id: {{adapter.camunda.cluster_id}}
         region: {{adapter.camunda.region}}
     app:
      cma:
        project-name: ${{values.project_name}}
        application-name: ${spring.application.name}
        core:
          security:
            oauth2:   
              resource-server:
                - ping:
                    jwk-cache-ttl: {{app.cma.core.security.oauth2.resource-server.ping.jwk-cache-ttl}}
                    jwk-cache-refresh: {{app.cma.core.security.oauth2.resource-server.ping.jwk-cache-refresh}}
                    jwk-set-uri: {{app.cma.core.security.oauth2.resource-server.ping.jwk-set-uri}}
                    identifier:
                      client-id:
          technical-message:
             sqs:
               queue-configs:
                  queueUrl: {{app.cma.core.technical-message.sqs.queue-configs.queueUrl}}
          cloud:
              aws:
                region: eu-west-1
                credentials:
                  webIdentityTokenFile: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
                role: {{app.cma.core.cloud.aws.role}}