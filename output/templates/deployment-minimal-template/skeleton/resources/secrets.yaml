apiVersion: v1
kind: Secret
metadata:
  name: ${{values.project_name}}
  namespace: {{k8s.namespace}}
type: Opaque
stringData:
  application-secrets.yaml: >-
    camunda:
       client:
         auth:
           client-id: {{adapter.camunda.client_id}}
           client-secret: {{adapter.camunda.client_secret}}