apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: node-service-template
  title: Node.js Service
  description: Scaffolds a Node.js microservice with package management, Docker, and Backstage integration.
  annotations:
    simpleicons.org/icon-slug: nodedotjs
    backstage.io/techdocs-ref: dir:.
  tags:
    - application
spec:
  type: service
  owner: group:default/it-development-software-engineering-developer-platform
  parameters:
    - title: Service identity
      required: [name, description, owner]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:help: 'Kebab-case, unique dans le Catalog. Ex: quote-pricing-api'
        description:
          title: Description
          type: string
          ui:help: 'Une phrase décrivant le service. Apparaîtra dans le Catalog.'
        owner:
          title: Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Équipe responsable. Sera paginée en cas d''incident.'

    - title: Catalog placement
      required: [system, domain]
      properties:
        system:
          title: System
          type: string
          ui:help: 'System Backstage auquel ce service appartient. Ex: pricing'
        domain:
          title: Domain
          type: string
          ui:help: 'Domain métier. Ex: finance, shipping, platform'

    - title: Node configuration
      required: [nodeVersion]
      properties:
        nodeVersion:
          title: Node version
          type: string
          enum: ['20', '22']
          default: '22'
          enumNames:
            - "Node 20 LTS"
            - "Node 22 LTS"
          ui:help: 'Version Node.js pour le runtime'
        nodejsVersion:
          title: Node.js Pipeline Version
          type: string
          default: 'NODE_22'
          ui:help: "Code outil Node.js pour le pipeline. NODE_22 pour Node 22, NODE_20 pour Node 20."

    - title: GitLab Information
      required: [architectureArea, gitlabNamespace]
      properties:
        architectureArea:
          title: Architecture Area
          type: string
          ui:help: 'Domaine d''architecture en GitLab. Ex: finance, shipping, platform'
        gitlabNamespace:
          title: GitLab Namespace
          type: string
          ui:help: 'Espace de noms GitLab pour le projet. Ex: pricing-services'

  steps:
    - id: fetch-skeleton
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}
          nodeVersion: ${{ parameters.nodeVersion }}
          nodejsVersion: ${{ parameters.nodejsVersion }}

    - id: publish-repo
      name: Publish repository
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: github.com?owner=cma-cgm&repo=${{ parameters.name }}
        description: ${{ parameters.description }}

    - id: register-catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-repo'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish-repo'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        url: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: Next Steps
        content: |
          Service **${{ parameters.name }}** créé avec succès.
          1. Clone : `git clone ${{ steps['publish-repo'].output.remoteUrl }}`
          2. Installez les dépendances : `npm install`
          3. Lancez localement : `npm start`
          4. Le pipeline CI démarre automatiquement au premier push
