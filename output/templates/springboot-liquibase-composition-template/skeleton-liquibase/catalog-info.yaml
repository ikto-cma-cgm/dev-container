# Liquibase migrations module — descriptor.
#
# Required by the project linter (R12-R14) for any skeleton-*/ directory.
# This file is NOT a registered Backstage entity: catalog registration happens
# via the multi-doc catalog-info.yaml at the repository root (which declares
# both the Spring Boot Component and the Liquibase Resource).
#
# At scaffold time, fetch:template copies this file into
# `src/main/resources/db/migration/catalog-info.yaml`. Backstage only discovers
# the root catalog-info.yaml by default, so this copy is inert.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: liquibase-migrations-marker
  description: Marker file for the Liquibase migrations skeleton module.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: url
  targets: []
  # Lifecycle echoes project rule R14; Location entities do not honor lifecycle
  # at runtime, but the linter checks for the keyword presence.
  lifecycle: experimental
