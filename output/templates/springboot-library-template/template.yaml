apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: springboot-library-template
  title: Spring Boot Library
  description: Scaffolds a reusable Spring Boot Maven library with Backstage integration and Nexus publishing.
  annotations:
    simpleicons.org/icon-slug: springboot
    backstage.io/techdocs-ref: dir:.
  tags:
    - application
spec:
  type: library
  owner: group:default/it-development-software-engineering-developer-platform
  parameters:
    - title: Service identity
      required: [name, description, owner]
      properties:
        name:
          title: Library name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:help: 'Kebab-case, unique dans le Catalog. Ex: common-utils'
        description:
          title: Description
          type: string
          ui:help: 'Une phrase décrivant la librairie. Apparaîtra dans le Catalog.'
        owner:
          title: Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Équipe responsable de la librairie.'

    - title: Catalog placement
      required: [system, domain]
      properties:
        system:
          title: System
          type: string
          ui:help: 'System Backstage auquel cette librairie appartient. Ex: core'
        domain:
          title: Domain
          type: string
          ui:help: 'Domain métier. Ex: finance, shipping, platform'

    - title: Build configuration
      required: [javaVersion, groupId]
      properties:
        javaVersion:
          title: Java version
          type: string
          enum: ['17', '21']
          default: '21'
          ui:help: 'Version Java pour la compilation.'
        javaTool:
          title: Java Tool
          type: string
          default: 'JAVA_21'
          ui:help: "Code outil Java pour le pipeline. JAVA_21 pour Java 21, JAVA_17 pour Java 17."
        groupId:
          title: Maven Group ID
          type: string
          default: 'com.cma'
          ui:help: 'Identifiant Maven du groupe. Ex: com.cma'
        packageName:
          title: Java package name
          type: string
          default: 'com.example.lib'
          ui:help: 'Package racine pour les classes Java. Ex: com.cma.common'
        springBootVersion:
          title: Spring Boot version
          type: string
          default: '3.4.2'
          ui:help: 'Version de Spring Boot utilisée pour les dépendances.'

    - title: GitLab Information
      required: [architectureArea, gitlabNamespace]
      properties:
        architectureArea:
          title: Architecture Area
          type: string
          ui:help: 'Domaine d''architecture en GitLab. Ex: finance, shipping, platform'
        gitlabNamespace:
          title: GitLab Namespace
          type: string
          ui:help: 'Espace de noms GitLab pour le projet. Ex: pricing-services'

  steps:
    - id: fetch-skeleton
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}
          javaVersion: ${{ parameters.javaVersion }}
          javaTool: ${{ parameters.javaTool }}
          groupId: ${{ parameters.groupId }}
          packageName: ${{ parameters.packageName }}
          springBootVersion: ${{ parameters.springBootVersion }}

    - id: publish-repo
      name: Publish repository
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: github.com?owner=cma-cgm&repo=${{ parameters.name }}
        description: ${{ parameters.description }}

    - id: register-catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-repo'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish-repo'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        url: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: Next Steps
        content: |
          Librairie **${{ parameters.name }}** créée avec succès.
          1. Clone : `git clone ${{ steps['publish-repo'].output.remoteUrl }}`
          2. Installez : `mvn clean install`
          3. Publiez sur Nexus : `mvn clean deploy -Prelease`
          4. Le pipeline CI démarre automatiquement au premier push
