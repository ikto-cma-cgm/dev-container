apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{values.project_name}}_deployment
  title: ${{values.project_name}}
  description: ${{values.description}}
  links:
    - url: https://github.com/cma-cgm/${{values.project_name}}_deployment
      title: Deployment Repository
      icon: github
  annotations:
    simpleicons.org/icon-slug: kubernetes
    backstage.io/techdocs-ref: dir:.
spec:
  type: kubernetes
  lifecycle: experimental
  owner: ${{values.owner}}
  system: ${{values.system}}
  domain: ${{values.domain}}
