apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{values.project_name}}
  namespace: {{k8s.namespace}}
  annotations:
    kubernetes.io/ingress.class: nginx-internal
spec:
  defaultBackend:
    service:
      name: ${{values.project_name}}
      port:
        number: 8080
  rules:
    - host: {{k8s.ingress.host}}
      http:
        paths:
          - backend:
              service:
                name: ${{values.project_name}}
                port:
                  number: 8080
            path: {{base-path}}
            pathType: Prefix     
  tls:
  - hosts:
    - {{k8s.ingress.host}}
