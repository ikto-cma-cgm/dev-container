apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.artifact_id}}
  title: ${{values.artifact_id}}
  description: ${{values.description}}
  links:
    - url: https://github.com/cma-cgm/${{values.artifact_id}}
      title: Repository
      icon: github
    - url: https://wiki.cma-cgm.com/${{values.artifact_id}}/runbook
      title: On-call runbook
      icon: docs
  annotations:
    backstage.io/techdocs-ref: dir:.
    simpleicons.org/icon-slug: camunda
    sonarqube.org/project-key: ${{values.group_id}}:${{values.artifact_id}}
    backstage.io/source-template: template:default/standard-camunda-microservice-template
    jenkins.io/job-full-name: ${{values.jenkins_job_url}}
spec:
  type: service
  lifecycle: experimental
  owner: ${{values.owner | dump}}
  system: ${{values.system}}
  domain: ${{values.domain}}
  providesApis:
    - ${{values.artifact_id}}-def
  dependsOn:
    - component:oauth2-resource
    - component:core-common
    - resource:${{values.artifact_id}}_deployment
