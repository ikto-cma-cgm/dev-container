apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: liquibase-service-template
  title: Liquibase Database Migrations
  description: Scaffolds a Liquibase migration project with db-changelog, deployit-manifest and Backstage Component registration.
  annotations:
    simpleicons.org/icon-slug: liquibase
    backstage.io/techdocs-ref: dir:.
  tags:
    - application
spec:
  type: library
  owner: group:default/it-development-software-engineering-developer-platform
  parameters:
    - title: Service identity
      required: [name, description, owner]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:help: 'Nom du projet Liquibase en kebab-case. Ex: quote-pricing-db'
        description:
          title: Description
          type: string
          ui:help: 'Description du projet de migrations. Apparaît dans le Catalog.'
        owner:
          title: Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Équipe responsable des migrations de base de données.'

    - title: Catalog placement
      required: [system, domain]
      properties:
        system:
          title: System
          type: string
          ui:help: 'System Backstage associé. Ex: pricing'
        domain:
          title: Domain
          type: string
          ui:help: 'Domain métier. Ex: finance, shipping, platform'

    - title: Liquibase configuration
      required: [changelogName, application]
      properties:
        changelogName:
          title: Changelog name
          type: string
          default: 'DB-SCRIPTS'
          ui:help: 'Nom du changelog dans deployit-manifest.xml. Sera préfixé par le nom du service.'
        application:
          title: Application path
          type: string
          default: 'default/my-service'
          ui:help: 'Chemin dapplication dans XLD. Format: architecture_area/namespace'
        dbms:
          title: Database type
          type: string
          enum: ['postgresql', 'oracle']
          default: 'postgresql'
          ui:help: 'SGBD cible des scripts de migration.'

    - title: Repository platform
      required: [publishPlatform]
      properties:
        publishPlatform:
          title: Publish to
          type: string
          enum: ['github', 'gitlab']
          default: 'github'
          enumNames:
            - "GitHub"
            - "GitLab"
          ui:help: 'Plateforme de publication du repository (mutuellement exclusif).'

    - title: GitHub Information
      required: [githubOwner]
      properties:
        githubOwner:
          title: GitHub Owner
          type: string
          default: 'cma-cgm'
          ui:help: 'Organisation ou utilisateur GitHub propriétaire du repository.'
      when: ${{ parameters.publishPlatform === 'github' }}

    - title: GitLab Information
      required: [gitlabNamespace, gitlabHost]
      properties:
        gitlabHost:
          title: GitLab Host
          type: string
          default: 'gitlab.com'
          ui:help: 'Hôte GitLab. Ex: gitlab.com ou gitlab.cma-cgm.com'
        gitlabNamespace:
          title: GitLab Namespace
          type: string
          ui:help: 'Espace de noms GitLab pour le projet. Ex: pricing-services'
      when: ${{ parameters.publishPlatform === 'gitlab' }}

    - title: Architecture
      properties:
        architectureArea:
          title: Architecture Area
          type: string
          ui:help: 'Domaine d''architecture. Ex: finance, shipping, platform'

  steps:
    - id: fetch-skeleton
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}
          changelogName: ${{ parameters.changelogName }}
          application: ${{ parameters.application }}
          dbms: ${{ parameters.dbms }}

    - id: publish-github
      name: Publish on GitHub
      if: ${{ parameters.publishPlatform === 'github' }}
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.name }}
        description: ${{ parameters.description }}

    - id: publish-gitlab
      name: Publish on GitLab
      if: ${{ parameters.publishPlatform === 'gitlab' }}
      action: publish:gitlab
      input:
        allowedHosts: ["${{ parameters.gitlabHost }}"]
        repoUrl: ${{ parameters.gitlabHost }}?owner=${{ parameters.gitlabNamespace }}&repo=${{ parameters.name }}
        defaultBranch: main
        description: ${{ parameters.description }}

    - id: register-catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: "${{ parameters.publishPlatform === 'github' ? steps['publish-github'].output.repoContentsUrl : steps['publish-gitlab'].output.repoContentsUrl }}"
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: "${{ parameters.publishPlatform === 'github' ? steps['publish-github'].output.remoteUrl : steps['publish-gitlab'].output.remoteUrl }}"
      - title: Open in Catalog
        icon: catalog
        url: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: Next Steps
        content: |
          Projet Liquibase **${{ parameters.name }}** créé avec succès.
          1. Clone : `git clone ${{ parameters.publishPlatform === 'github' ? steps['publish-github'].output.remoteUrl : steps['publish-gitlab'].output.remoteUrl }}`
          2. Ajoutez vos scripts SQL dans `src/001_scripts/`
          3. Mettez à jour `db-changelog.xml` pour inclure vos nouveaux changelogs
          4. Le pipeline XL Deploy packagera les migrations automatiquement
