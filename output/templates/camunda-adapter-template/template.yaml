apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: camunda-adapter-template
  title: Camunda Adapter Template
  description: >
    Camunda BPMN adapter module for Spring Boot microservices. Adds Camunda client,
    job workers, BPMN commands, and booking workflow samples. Designed to compose with
    spring-boot-base-template.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - integration
    - camunda
    - bpmn
spec:
  type: service
  owner: group:default/it-development-software-engineering-developer-platform
  parameters:
    - title: Service identity
      required: [name, description, owner]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:help: 'Kebab-case, unique in the Catalog. Ex: booking-api'
        description:
          title: Description
          type: string
          ui:help: 'One-line description of the service.'
        owner:
          title: Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Team responsible for this service.'
    - title: Camunda Configuration
      required: [bpmnProcessId]
      properties:
        bpmnProcessId:
          title: BPMN Process ID
          type: string
          default: camunda-adapter-sample
          ui:help: 'The BPMN process definition ID to use for workflow orchestration.'
  steps:
    - id: fetch-camunda-skeleton
      name: Fetch Camunda skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          bpmn_process_id: ${{ parameters.bpmnProcessId }}
  output:
    links:
      - title: Camunda Integration
        icon: docs
        url: ./docs/camunda-integration.md
    text:
      - title: Camunda Adapter Installed
        content: |
          Camunda adapter files added to your project.
          BPMN Process ID: ${{ parameters.bpmnProcessId }}
          Configure your Camunda cluster credentials in application-local.yaml.
