## Service Standards — Linter Rules Configuration
## This file is the source of truth for the rules enforced by lint-templates.mjs.
## Modify this file to add/remove valid types, tags, or change thresholds.
## No JavaScript changes needed for configuration updates.

identity:
  # R01 — metadata.name must end with this suffix, in kebab-case
  nameSuffix: '-template'

  # R03 — metadata.description max length
  maxDescriptionLength: 200

  # R05 — allowed values for spec.type
  validTypes:
    - service
    - website
    - library
    - pipeline
    - testing-tool
    - code-analysis
    - action

  # R06 — at least one of these tags must be present
  categoryTags:
    - application
    - integration
    - quality
    - action

  # R07 — these tags are not allowed
  forbiddenTags:
    - one-click
    - golden-path
    - demo
    - advanced
    - simple

parameters:
  # R08-R10 — these parameters are required (skipped for action templates)
  requiredParams:
    - name
    - description
    - owner

  # R10 — the owner parameter must use this UI field
  ownerField: EntityPicker

  # R08-R10 — template types that skip parameter rules
  skipParamRulesForTypes:
    - action

skeleton:
  # Directory patterns recognized as skeleton directories for rules R12-R16.
  # 'skeleton'   = standard unit template convention.
  # 'skeleton-*' = composite Option C convention (pre-assembled skeleton with
  #                multiple top-level dirs like skeleton-app/, skeleton-liquibase/).
  # Glob: only '*' is treated as a wildcard suffix.
  # If no matching directory is found, R12-R16 are SKIPPED (action-only template).
  directoryPatterns:
    - skeleton
    - 'skeleton-*'

  # R12, R15 — these files must exist in each detected skeleton directory
  requiredFiles:
    - catalog-info.yaml
    - README.md

  # R13 — these annotations must be present in skeleton/catalog-info.yaml
  requiredAnnotations:
    - backstage.io/techdocs-ref

  # R14 — expected lifecycle value
  lifecycle: experimental

  # R16 — expressions with these prefixes are allowed in skeleton files
  allowedExpressionPrefixes:
    - 'values.'
    - 'parameters.'
    - 'steps['
    - 'steps.'
    - 'secrets.'
    - 'env.'
    - 'github.'
    - 'matrix.'
    - "'${"
    - '"https'
    - '"http'
    - "'' |"
    - '"" |'

## Composable Service Governance — mechanizes the composable standards.
## Category 'Composable' = the SMT-99 page rules C01-C05 (pinned refs, System
## entry, component relations, no duplication, consistent linking params),
## evaluated only on composable orchestrators. Category 'ADR governance' = the
## ADR-0001 rules R1 (SemVer publication tag) and R3 (valid lifecycle), checked
## on every template. Source of truth for the C0x IDs is the SMT-99 page.
composable:
  # ADR-R3 — spec.lifecycle on produced catalog entities must be a valid value.
  validLifecycles:
    - experimental
    - production
    - deprecated

  # SemVer version pattern. ADR-R1 tag form: '<template-name>/vX.Y.Z' (monorepo)
  # or a bare 'vX.Y.Z'. C01 accepts a remote fetch:template only when pinned to a
  # ref matching this pattern (a SemVer tag) or a commit SHA; any branch name
  # (master/main/develop/...) is rejected as a moving ref.
  semverTagPattern: 'v\d+\.\d+\.\d+'

  # C03 — dependsOn references allowed even when not produced by this template
  # (governed shared bricks owned elsewhere). Empty today: no governed shared
  # brick exists yet, so every external dependsOn is treated as a phantom.
  dependsOnAllowlist: []
