version: '3.8'

services:
  # PostgreSQL database for SonarQube
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-ephemeral-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - sonar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SonarQube application
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube-ephemeral
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Disable telemetry
      SONAR_TELEMETRY_ENABLE: false
      # Performance tuning for ephemeral use
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
      # Java options for faster startup
      SONAR_JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - sonar-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  sonar-db-data:
    driver: local
  sonar-data:
    driver: local
  sonar-extensions:
    driver: local
  sonar-logs:
    driver: local

networks:
  sonar-network:
    driver: bridge
