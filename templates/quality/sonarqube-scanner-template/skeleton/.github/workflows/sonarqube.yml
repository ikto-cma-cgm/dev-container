name: SonarQube Code Quality Analysis

on:
  {% if values.scanOnPush %}push:
    branches:
      - main
      - master
      - develop
  {% endif %}
  {% if values.scanOnPR %}pull_request:
    branches:
      - main
      - master
      - develop
  {% endif %}
  workflow_dispatch:

env:
  SONAR_HOST_URL: http://localhost:9000
  SONAR_TOKEN: admin  # Default token for ephemeral mode
  NODE_VERSION: '20.x'

jobs:
  {% if values.serviceMode == 'ephemeral' %}
  sonarqube-scan-ephemeral:
    name: SonarQube Scan (Ephemeral)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'

      {% if values.projectType == 'frontend' or values.projectType == 'fullstack' %}
      - name: Install frontend dependencies
        run: |
          {% if values.projectType == 'fullstack' %}cd apps/frontend && {% endif %}npm ci

      - name: Run frontend tests with coverage
        run: |
          {% if values.projectType == 'fullstack' %}cd apps/frontend && {% endif %}npm run test -- --coverage --watchAll=false
        continue-on-error: true
      {% endif %}

      {% if values.projectType == 'backend' or values.projectType == 'fullstack' %}
      - name: Install backend dependencies
        run: |
          {% if values.projectType == 'fullstack' %}cd apps/backend && {% endif %}npm ci

      - name: Run backend tests with coverage
        run: |
          {% if values.projectType == 'fullstack' %}cd apps/backend && {% endif %}npm run test -- --coverage
        continue-on-error: true
      {% endif %}

      - name: Start ephemeral SonarQube service
        run: |
          echo "🚀 Starting ephemeral SonarQube service..."
          docker compose -f sonar-config/docker-compose.sonar.yml up -d
          
          echo "⏳ Waiting for SonarQube to be ready..."
          timeout=300
          elapsed=0
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ SonarQube failed to start within ${timeout}s"
              docker compose -f sonar-config/docker-compose.sonar.yml logs
              exit 1
            fi
            echo "Waiting... (${elapsed}s/${timeout}s)"
            sleep 10
            elapsed=$((elapsed + 10))
          done
          
          echo "✅ SonarQube is ready!"
          
          # Wait a bit more for full initialization
          sleep 20

      - name: Configure SonarQube (First-time setup)
        run: |
          echo "🔧 Configuring SonarQube..."
          
          # Change default admin password
          curl -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=admin123"
          
          # Create project token
          TOKEN_RESPONSE=$(curl -u admin:admin123 -X POST "http://localhost:9000/api/user_tokens/generate?name=${{ values.projectKey }}-token")
          SONAR_TOKEN=$(echo $TOKEN_RESPONSE | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          
          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️  Failed to create token, using default credentials"
            SONAR_TOKEN="admin:admin123"
          else
            echo "✅ Token created successfully"
          fi
          
          # Save token for next step
          echo "SONAR_AUTH_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV
          
          {% if values.qualityGate == 'strict' %}
          # Create strict quality gate
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create?name=Strict"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Strict&metric=new_coverage&op=LT&error=90"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Strict&metric=coverage&op=LT&error=${{ values.minCoverage }}"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Strict&metric=duplicated_lines_density&op=GT&error=${{ values.minDuplication }}"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Strict&metric=new_reliability_rating&op=GT&error=1"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Strict&metric=new_security_rating&op=GT&error=1"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Strict&metric=new_maintainability_rating&op=GT&error=1"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/set_as_default?name=Strict"
          {% elif values.qualityGate == 'balanced' %}
          # Create balanced quality gate
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create?name=Balanced"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Balanced&metric=new_coverage&op=LT&error=80"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Balanced&metric=coverage&op=LT&error=${{ values.minCoverage }}"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Balanced&metric=duplicated_lines_density&op=GT&error=${{ values.minDuplication }}"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Balanced&metric=new_reliability_rating&op=GT&error=1"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/set_as_default?name=Balanced"
          {% else %}
          # Create lenient quality gate
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create?name=Lenient"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Lenient&metric=new_coverage&op=LT&error=70"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/create_condition?gateName=Lenient&metric=coverage&op=LT&error=${{ values.minCoverage }}"
          curl -u admin:admin123 -X POST "http://localhost:9000/api/qualitygates/set_as_default?name=Lenient"
          {% endif %}
          
          echo "✅ Quality gate configured"

      - name: Run SonarQube Scanner
        run: |
          echo "🔍 Running SonarQube analysis..."
          
          npx sonarqube-scanner \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=${SONAR_AUTH_TOKEN} \
            -Dsonar.projectKey=${{ values.projectKey }} \
            -Dsonar.projectName="${{ values.projectName }}" \
            -Dsonar.projectVersion=${{ values.projectVersion }} \
            {% if values.enableBranchAnalysis %}-Dsonar.branch.name=${GITHUB_REF#refs/heads/} \{% endif %}
            -Dsonar.scm.revision=${GITHUB_SHA} \
            -Dsonar.verbose=false
        env:
          SONAR_AUTH_TOKEN: {% raw %}${{ env.SONAR_AUTH_TOKEN }}{% endraw %}

      - name: Wait for Quality Gate result
        {% if values.blockOnFailure %}run: |{% else %}run: |
        continue-on-error: true{% endif %}
          echo "⏳ Waiting for Quality Gate result..."
          sleep 10
          
          # Get the task ID from the report
          TASK_ID=$(cat .scannerwork/report-task.txt | grep ceTaskId | cut -d'=' -f2)
          
          # Poll for task completion
          for i in {1..30}; do
            STATUS=$(curl -s -u admin:admin123 "http://localhost:9000/api/ce/task?id=$TASK_ID" | grep -o '"status":"[^"]*' | cut -d'"' -f4)
            
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Analysis completed successfully"
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "❌ Analysis failed"
              exit 1
            fi
            
            echo "Analysis in progress... ($i/30)"
            sleep 5
          done
          
          # Get quality gate status
          QG_STATUS=$(curl -s -u admin:admin123 "http://localhost:9000/api/qualitygates/project_status?projectKey=${{ values.projectKey }}" | grep -o '"status":"[^"]*' | cut -d'"' -f4)
          
          echo "📊 Quality Gate Status: $QG_STATUS"
          
          if [ "$QG_STATUS" = "ERROR" ]; then
            echo "❌ Quality Gate failed!"
            {% if values.blockOnFailure %}exit 1{% else %}echo "⚠️  Continuing despite quality gate failure (blockOnFailure=false)"{% endif %}
          elif [ "$QG_STATUS" = "OK" ]; then
            echo "✅ Quality Gate passed!"
          else
            echo "⚠️  Quality Gate status: $QG_STATUS"
          fi

      - name: Display analysis results
        if: always()
        run: |
          echo "📊 SonarQube Analysis Results"
          echo "=============================="
          echo ""
          echo "Project: ${{ values.projectName }}"
          echo "Key: ${{ values.projectKey }}"
          echo ""
          echo "View detailed results:"
          echo "http://localhost:9000/dashboard?id=${{ values.projectKey }}"
          echo ""
          echo "Note: This is an ephemeral instance. Results will not persist after this workflow."

      - name: Capture SonarQube logs (on failure)
        if: failure()
        run: |
          echo "📋 SonarQube Logs:"
          docker compose -f sonar-config/docker-compose.sonar.yml logs sonarqube

      - name: Stop and cleanup ephemeral SonarQube
        if: always()
        run: |
          echo "🧹 Cleaning up ephemeral SonarQube service..."
          docker compose -f sonar-config/docker-compose.sonar.yml down -v
          echo "✅ Cleanup complete"

  {% else %}
  sonarqube-scan-centralized:
    name: SonarQube Scan (Centralized)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'

      {% if values.projectType == 'frontend' or values.projectType == 'fullstack' %}
      - name: Install and test frontend
        run: |
          {% if values.projectType == 'fullstack' %}cd apps/frontend && {% endif %}npm ci
          {% if values.projectType == 'fullstack' %}cd apps/frontend && {% endif %}npm run test -- --coverage --watchAll=false
        continue-on-error: true
      {% endif %}

      {% if values.projectType == 'backend' or values.projectType == 'fullstack' %}
      - name: Install and test backend
        run: |
          {% if values.projectType == 'fullstack' %}cd apps/backend && {% endif %}npm ci
          {% if values.projectType == 'fullstack' %}cd apps/backend && {% endif %}npm run test -- --coverage
        continue-on-error: true
      {% endif %}

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
          SONAR_HOST_URL: {% raw %}${{ secrets.SONAR_HOST_URL }}{% endraw %}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        {% if not values.blockOnFailure %}continue-on-error: true{% endif %}
        timeout-minutes: 5
        env:
          SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
  {% endif %}
