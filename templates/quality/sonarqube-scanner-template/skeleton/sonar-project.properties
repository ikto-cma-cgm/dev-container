# SonarQube Project Configuration
# Documentation: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project identification
sonar.projectKey=${{ values.projectKey }}
sonar.projectName=${{ values.projectName }}
sonar.projectVersion=${{ values.projectVersion }}

# Source code configuration
sonar.sourceEncoding=${{ values.sourceEncoding }}

{% if values.projectType == 'frontend' %}
# Frontend (React/Next.js) configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/public/**,**/.next/**,**/out/**

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-reporter.xml

{% elif values.projectType == 'backend' %}
# Backend (Node.js/Express) configuration
sonar.sources=src
sonar.tests=src,test,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js,**/tests/**,**/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

{% else %}
# Full-Stack (Monorepo) configuration
sonar.sources=apps/frontend/src,apps/backend/src
sonar.tests=apps/frontend/src,apps/backend/src,apps/backend/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.spec.js,**/public/**,**/.next/**,**/out/**

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info,apps/backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/frontend/coverage/lcov.info,apps/backend/coverage/lcov.info
{% endif %}

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/mocks/**,**/__mocks__/**,**/setupTests.ts

# Duplication detection
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Quality Gate thresholds (configured based on selected level)
{% if values.qualityGate == 'strict' %}
# Strict quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
{% elif values.qualityGate == 'balanced' %}
# Balanced quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
{% else %}
# Lenient quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
{% endif %}

# Security
{% if values.enableSecurityHotspots %}
sonar.security.hotspots.reviewPriority=MEDIUM
{% endif %}

# Branch analysis
{% if values.enableBranchAnalysis %}
# Branch analysis will be configured via CI/CD environment variables
# sonar.branch.name will be set automatically
{% endif %}

# Additional analysis parameters
sonar.language=js,ts
sonar.dynamicAnalysis=reuseReports

# Issue filters
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore specific rules for test files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts*

# Ignore console.log in development files
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2228
sonar.issue.ignore.multicriteria.e2.resourceKey=**/src/utils/logger.ts

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*

# Links
sonar.links.homepage=https://github.com/${{ values.owner }}/${{ values.projectKey }}
sonar.links.ci=https://github.com/${{ values.owner }}/${{ values.projectKey }}/actions
sonar.links.scm=https://github.com/${{ values.owner }}/${{ values.projectKey }}
sonar.links.issue=https://github.com/${{ values.owner }}/${{ values.projectKey }}/issues
