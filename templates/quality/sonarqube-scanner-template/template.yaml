apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: sonarqube-scanner-template
  title: SonarQube Code Quality Scanner
  description: Add SonarQube scanning to your project with ephemeral service support for continuous code quality analysis
  tags:
    - quality
    - sonarqube
    - code-analysis
    - security
    - testing
spec:
  owner: quality-team
  type: quality-service

  parameters:
    - title: Project Information
      required:
        - projectKey
        - projectName
      properties:
        projectKey:
          title: Project Key
          type: string
          description: Unique identifier for SonarQube project (lowercase, hyphens allowed)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
          ui:help: 'Must match your repository name (e.g., my-project)'

        projectName:
          title: Project Display Name
          type: string
          description: Human-readable project name
          maxLength: 100

        projectVersion:
          title: Project Version
          type: string
          description: Version of the project
          default: '1.0.0'

    - title: Project Type & Structure
      required:
        - projectType
      properties:
        projectType:
          title: Project Type
          type: string
          description: Type of project to scan
          default: fullstack
          enum:
            - frontend
            - backend
            - fullstack
          enumNames:
            - 'Frontend (React/Next.js)'
            - 'Backend (Node.js/Express)'
            - 'Full-Stack (Monorepo)'

        sourceEncoding:
          title: Source Encoding
          type: string
          description: Character encoding of source files
          default: UTF-8
          enum:
            - UTF-8
            - ISO-8859-1

    - title: Quality Gate Configuration
      properties:
        qualityGate:
          title: Quality Gate Level
          type: string
          description: Strictness level for quality gate
          default: balanced
          enum:
            - strict
            - balanced
            - lenient
          enumNames:
            - 'Strict (Production-ready)'
            - 'Balanced (Recommended)'
            - 'Lenient (Development)'

        minCoverage:
          title: Minimum Code Coverage (%)
          type: number
          description: Minimum percentage of code coverage required
          default: 80
          minimum: 0
          maximum: 100

        minDuplication:
          title: Maximum Duplication (%)
          type: number
          description: Maximum allowed code duplication percentage
          default: 3
          minimum: 0
          maximum: 100

        blockOnFailure:
          title: Block on Quality Gate Failure
          type: boolean
          description: Fail CI/CD pipeline if quality gate is not passed
          default: true

    - title: Analysis Configuration
      properties:
        enableSecurityHotspots:
          title: Enable Security Analysis
          type: boolean
          description: Scan for security vulnerabilities and hotspots
          default: true

        enableBranchAnalysis:
          title: Enable Branch Analysis
          type: boolean
          description: Analyze all branches (requires SonarQube Developer Edition)
          default: false

        enablePRDecoration:
          title: Enable PR Decoration
          type: boolean
          description: Add SonarQube comments to Pull Requests
          default: true

        scanOnPR:
          title: Scan on Pull Requests
          type: boolean
          description: Run analysis on every pull request
          default: true

        scanOnPush:
          title: Scan on Push to Main
          type: boolean
          description: Run analysis on push to main branch
          default: true

    - title: Service Mode
      properties:
        serviceMode:
          title: SonarQube Service Mode
          type: string
          description: How to run SonarQube scanner
          default: ephemeral
          enum:
            - ephemeral
            - centralized
          enumNames:
            - 'Ephemeral (Docker container per scan)'
            - 'Centralized (External SonarQube server)'

  steps:
    - id: fetch-template
      name: Fetch SonarQube Configuration
      action: fetch:template
      input:
        url: ./skeleton
        values:
          projectKey: ${{ parameters.projectKey }}
          projectName: ${{ parameters.projectName }}
          projectVersion: ${{ parameters.projectVersion }}
          projectType: ${{ parameters.projectType }}
          sourceEncoding: ${{ parameters.sourceEncoding }}
          qualityGate: ${{ parameters.qualityGate }}
          minCoverage: ${{ parameters.minCoverage }}
          minDuplication: ${{ parameters.minDuplication }}
          blockOnFailure: ${{ parameters.blockOnFailure }}
          enableSecurityHotspots: ${{ parameters.enableSecurityHotspots }}
          enableBranchAnalysis: ${{ parameters.enableBranchAnalysis }}
          enablePRDecoration: ${{ parameters.enablePRDecoration }}
          scanOnPR: ${{ parameters.scanOnPR }}
          scanOnPush: ${{ parameters.scanOnPush }}
          serviceMode: ${{ parameters.serviceMode }}

  output:
    text:
      - title: SonarQube Configuration Added
        content: |
          SonarQube scanning has been configured for **${{ parameters.projectName }}**! 🎉

          ## 📊 Configuration Summary

          - **Project Key**: `${{ parameters.projectKey }}`
          - **Project Type**: ${{ parameters.projectType }}
          - **Quality Gate**: ${{ parameters.qualityGate }}
          - **Min Coverage**: ${{ parameters.minCoverage }}%
          - **Service Mode**: ${{ parameters.serviceMode }}

          ## 📁 Files Added

          ```
          .github/workflows/
          └── sonarqube.yml           # SonarQube scanning workflow
          sonar-config/
          ├── docker-compose.sonar.yml # Ephemeral SonarQube service
          └── quality-profiles/        # Custom quality profiles
          sonar-project.properties     # SonarQube configuration
          ```

          ## 🚀 Quick Start

          {% if parameters.serviceMode == 'ephemeral' %}
          ### Ephemeral Mode (No external setup required!)

          1. **Push your code** to trigger the workflow:
             ```bash
             git add .
             git commit -m "Add SonarQube scanning"
             git push
             ```

          2. **The workflow will automatically**:
             - Start a temporary SonarQube container
             - Run the code analysis
             - Check the quality gate
             - Stop and remove the container

          3. **View results** in the GitHub Actions logs

          **Note**: For ephemeral mode, results are not persisted between runs.
          {% else %}
          ### Centralized Mode Setup

          1. **Add GitHub Secrets** to your repository:
             - `SONAR_HOST_URL`: Your SonarQube server URL
             - `SONAR_TOKEN`: Authentication token

          2. **Push your code** to trigger the workflow:
             ```bash
             git add .
             git commit -m "Add SonarQube scanning"
             git push
             ```

          3. **View results** on your SonarQube server
          {% endif %}

          ## 🔧 Quality Gate Settings

          {% if parameters.qualityGate == 'strict' %}
          - **New Code Coverage**: ≥ 90%
          - **Overall Coverage**: ≥ ${{ parameters.minCoverage }}%
          - **Duplications**: ≤ ${{ parameters.minDuplication }}%
          - **Maintainability Rating**: A
          - **Reliability Rating**: A
          - **Security Rating**: A
          - **Security Hotspots**: Must be reviewed
          {% elif parameters.qualityGate == 'balanced' %}
          - **New Code Coverage**: ≥ 80%
          - **Overall Coverage**: ≥ ${{ parameters.minCoverage }}%
          - **Duplications**: ≤ ${{ parameters.minDuplication }}%
          - **Maintainability Rating**: A or B
          - **Reliability Rating**: A
          - **Security Rating**: A
          {% else %}
          - **New Code Coverage**: ≥ 70%
          - **Overall Coverage**: ≥ ${{ parameters.minCoverage }}%
          - **Duplications**: ≤ ${{ parameters.minDuplication }}%
          - **No critical issues**
          {% endif %}

          ## 📚 Next Steps

          1. Run your tests with coverage: `npm run test -- --coverage`
          2. Commit and push to trigger the scan
          3. Review the quality report in the workflow logs
          {% if parameters.enablePRDecoration %}
          4. Create a PR to see inline code quality comments
          {% endif %}

          ## 💡 Best Practices

          - Keep coverage reports updated before scanning
          - Fix critical and blocker issues immediately
          - Review security hotspots regularly
          - Exclude generated files and dependencies in sonar-project.properties
          - Use custom quality profiles for team-specific rules

          For more information, check the SONARQUBE_BEST_PRACTICES.md file.
