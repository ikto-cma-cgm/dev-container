name: WebdriverIO E2E Tests

on:
  {% if values.runOnPush %}
  push:
    branches:
      - main
      - master
      - develop
  {% endif %}
  {% if values.runOnPR %}
  pull_request:
    branches:
      - main
      - master
      - develop
  {% endif %}
  {% if values.runScheduled %}
  schedule:
    - cron: '{{ values.scheduleCron }}'
  {% endif %}
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  {% if values.dockerizeRunner %}
  e2e-tests-dockerized:
    name: E2E Tests (Dockerized)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker-compose -f webdriver-io/docker-compose.yml build

      - name: Run tests in Docker
        run: docker-compose -f webdriver-io/docker-compose.yml up --abort-on-container-exit --exit-code-from wdio-tests

      {% if values.enableScreenshots %}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-dockerized
          path: webdriver-io/test-results/screenshots/
          retention-days: 7
      {% endif %}

      {% if 'allure' in values.reporters %}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-dockerized
          path: webdriver-io/allure-results/
          retention-days: 7
      {% endif %}

      {% if 'junit' in values.reporters %}
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: WebdriverIO Tests - Dockerized
          path: webdriver-io/test-results/*.xml
          reporter: java-junit
      {% endif %}

      - name: Cleanup
        if: always()
        run: docker-compose -f webdriver-io/docker-compose.yml down -v

  {% elif values.executionMode == 'local' %}
  e2e-tests-local:
    name: E2E Tests (Local)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: {{ values.browsers | tojson }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'
          cache-dependency-path: webdriver-io/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./webdriver-io

      - name: Start application (if needed)
        run: |
          # Start your application in background
          # npm run start &
          # sleep 10
          echo "Application should be running at {{ values.baseUrl }}"

      - name: Run WebdriverIO tests
        run: npm run test:e2e
        working-directory: ./webdriver-io
        env:
          BROWSER: {% raw %}${{ matrix.browser }}{% endraw %}

      {% if values.enableScreenshots %}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-{% raw %}${{ matrix.browser }}{% endraw %}
          path: webdriver-io/test-results/screenshots/
          retention-days: 7
      {% endif %}

      {% if 'allure' in values.reporters %}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-{% raw %}${{ matrix.browser }}{% endraw %}
          path: webdriver-io/allure-results/
          retention-days: 7
      {% endif %}

      {% if 'junit' in values.reporters %}
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: WebdriverIO Tests - {% raw %}${{ matrix.browser }}{% endraw %}
          path: webdriver-io/test-results/*.xml
          reporter: java-junit
      {% endif %}

  {% elif values.executionMode == 'docker' %}
  e2e-tests-docker:
    name: E2E Tests (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'
          cache-dependency-path: webdriver-io/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./webdriver-io

      - name: Start Selenium Grid
        run: |
          docker-compose -f webdriver-io/wdio-config/docker-compose.wdio.yml up -d
          echo "Waiting for Selenium Grid to be ready..."
          sleep 10

      - name: Verify Selenium Grid
        run: |
          curl -sSL http://localhost:4444/wd/hub/status | jq .

      - name: Start application (if needed)
        run: |
          # Start your application in background
          # npm run start &
          # sleep 10
          echo "Application should be running at {{ values.baseUrl }}"

      - name: Run WebdriverIO tests
        run: npm run test:e2e
        working-directory: ./webdriver-io

      {% if values.enableScreenshots %}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-docker
          path: webdriver-io/test-results/screenshots/
          retention-days: 7
      {% endif %}

      {% if values.enableVideo %}
      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: webdriver-io/test-results/videos/
          retention-days: 7
      {% endif %}

      {% if 'allure' in values.reporters %}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-docker
          path: webdriver-io/allure-results/
          retention-days: 7
      {% endif %}

      - name: Selenium Grid logs
        if: failure()
        run: docker-compose -f webdriver-io/wdio-config/docker-compose.wdio.yml logs

      - name: Stop Selenium Grid
        if: always()
        run: docker-compose -f webdriver-io/wdio-config/docker-compose.wdio.yml down

  {% elif values.executionMode == 'cloud' %}
  e2e-tests-cloud:
    name: E2E Tests (Cloud)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: {{ values.browsers | tojson }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'
          cache-dependency-path: webdriver-io/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./webdriver-io

      - name: Start application (if needed)
        run: |
          # Start your application in background
          # npm run start &
          # sleep 10
          echo "Application should be running at {{ values.baseUrl }}"

      - name: Run WebdriverIO tests on BrowserStack
        run: npm run test:e2e
        working-directory: ./webdriver-io
        env:
          BROWSERSTACK_USERNAME: {% raw %}${{ secrets.BROWSERSTACK_USERNAME }}{% endraw %}
          BROWSERSTACK_ACCESS_KEY: {% raw %}${{ secrets.BROWSERSTACK_ACCESS_KEY }}{% endraw %}
          SAUCE_USERNAME: {% raw %}${{ secrets.SAUCE_USERNAME }}{% endraw %}
          SAUCE_ACCESS_KEY: {% raw %}${{ secrets.SAUCE_ACCESS_KEY }}{% endraw %}
          BROWSER: {% raw %}${{ matrix.browser }}{% endraw %}

      {% if 'allure' in values.reporters %}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-{% raw %}${{ matrix.browser }}{% endraw %}
          path: webdriver-io/allure-results/
          retention-days: 7
      {% endif %}

  {% endif %}

  {% if 'allure' in values.reporters %}
  generate-allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [{% if values.executionMode == 'local' %}e2e-tests-local{% elif values.executionMode == 'docker' %}e2e-tests-docker{% elif values.executionMode == 'cloud' %}e2e-tests-cloud{% endif %}]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: webdriver-io/allure-results
          merge-multiple: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: webdriver-io/allure-results
          allure_history: webdriver-io/allure-history

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          publish_dir: webdriver-io/allure-history
          destination_dir: allure-report
  {% endif %}
