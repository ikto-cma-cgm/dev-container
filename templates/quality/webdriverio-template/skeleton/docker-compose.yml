version: '3.8'

services:
  wdio-tests:
    build:
      context: .
      dockerfile: Dockerfile.wdio
      args:
        - BASE_IMAGE=${{ '${' }}DOCKER_BASE_IMAGE:-${{ values.dockerBaseImage or 'node:18-slim' }}${{ '}' }}
    image: ${{ values.projectName }}-wdio-tests:latest
    container_name: ${{ values.projectName }}-wdio-tests

    # Environment variables
    environment:
      # Application URL - Auto-fix: replaces localhost with host.docker.internal for Docker-to-Host access
      - BASE_URL=${{ '${' }}BASE_URL:-${{ values.baseUrl | replace("localhost", "host.docker.internal") | replace("127.0.0.1", "host.docker.internal") }}${{ '}' }}

      # Browser configuration
      - BROWSER=${{ '${' }}BROWSER:-chrome${{ '}' }}
      - HEADLESS=${{ '${' }}HEADLESS:-{% if values.headless %}true{% else %}false{% endif %}${{ '}' }}

      # Test execution
      - MAX_INSTANCES=${{ '${' }}MAX_INSTANCES:-{{ values.maxInstances }}${{ '}' }}
      - TEST_TIMEOUT=${{ '${' }}TEST_TIMEOUT:-{{ values.testTimeout }}${{ '}' }}
      - TEST_FRAMEWORK=${{ '${' }}TEST_FRAMEWORK:-{{ values.testFramework }}${{ '}' }}

      # Advanced options
      - LOG_LEVEL=${{ '${' }}LOG_LEVEL:-info${{ '}' }}
      - TZ=${{ '${' }}TZ:-Europe/Paris${{ '}' }}
      - DOCKER_BASE_IMAGE=${{ '${' }}DOCKER_BASE_IMAGE:-${{ values.dockerBaseImage or 'node:18-slim' }}${{ '}' }}

    # Network configuration
    # Allows tests to access services on host (e.g., http://host.docker.internal:3000)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Shared memory size (crucial for Chrome)
    shm_size: '2gb'

    # Volume mounts
    volumes:
      # Mount code and config for live updates without rebuild
      - ./tests:/tests/tests:ro
      - ./wdio-config:/tests/wdio-config:ro
      # Test results (read-write) - shared with host for easy access
      - ./test-results:/tests/test-results:rw
      - ./allure-results:/tests/allure-results:rw

networks:
  default:
    name: ${{ values.projectName }}-wdio-network
