# Resource entity representing the WebdriverIO testing capability
# This can be referenced by application components via dependsOn
#
# Note: The Template entity is defined in template.yaml, not here
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: webdriverio-e2e-testing
  title: WebdriverIO E2E Testing Capability
  description: |
    Dockerized end-to-end browser testing capability using WebdriverIO.
    Provides automated browser testing for functional validation.
  tags:
    - testing
    - e2e
    - quality
    - browser-automation
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://webdriver.io/docs/gettingstarted
      title: WebdriverIO Documentation
      icon: docs
    - url: https://webdriver.io/docs/api
      title: WebdriverIO API Reference
      icon: code
spec:
  type: testing-service
  owner: quality-team
