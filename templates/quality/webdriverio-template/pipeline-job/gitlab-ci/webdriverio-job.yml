# WebDriverIO E2E Tests - GitLab CI Job Template
# This job template is designed to be included in a main .gitlab-ci.yml
# It expects the webdriver-io/ directory to exist in the repository
#
# Usage in your .gitlab-ci.yml:
# include:
#   - local: 'webdriver-io/.gitlab-ci-job.yml'
#
# Or extend the job:
# e2e-tests:
#   extends: .webdriverio-e2e-tests
#   variables:
#     BASE_URL: "https://staging.example.com"

variables:
  WDIO_WORKING_DIRECTORY: "webdriver-io"
  WDIO_BASE_URL: "http://localhost:3000"
  WDIO_EXECUTION_MODE: "docker"
  WDIO_MAX_INSTANCES: "5"
  WDIO_NODE_VERSION: "18"

# Base job template for WebDriverIO E2E tests
.webdriverio-e2e-tests:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - |
      if [ ! -d "$WDIO_WORKING_DIRECTORY" ]; then
        echo "ERROR: WebDriverIO directory not found at $WDIO_WORKING_DIRECTORY"
        echo "Please ensure the WebDriverIO template has been applied to this repository."
        exit 1
      fi
      echo "WebDriverIO setup found at $WDIO_WORKING_DIRECTORY"
  script:
    - cd $WDIO_WORKING_DIRECTORY
    - |
      if [ "$WDIO_EXECUTION_MODE" = "docker" ]; then
        echo "Running E2E tests in Docker mode..."
        docker-compose up --build --abort-on-container-exit --exit-code-from wdio-tests
      else
        echo "ERROR: Only docker execution mode is supported in this GitLab CI template"
        exit 1
      fi
  after_script:
    - cd $WDIO_WORKING_DIRECTORY && docker-compose down -v || true
  artifacts:
    when: always
    paths:
      - $WDIO_WORKING_DIRECTORY/test-results/
      - $WDIO_WORKING_DIRECTORY/allure-results/
    reports:
      junit: $WDIO_WORKING_DIRECTORY/test-results/*.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# Concrete job for Docker execution (default)
webdriverio-e2e-docker:
  extends: .webdriverio-e2e-tests
  variables:
    WDIO_EXECUTION_MODE: "docker"

# Job variant for local execution (Node.js based)
.webdriverio-e2e-local:
  stage: test
  image: node:${WDIO_NODE_VERSION}-slim
  before_script:
    - |
      if [ ! -d "$WDIO_WORKING_DIRECTORY" ]; then
        echo "ERROR: WebDriverIO directory not found at $WDIO_WORKING_DIRECTORY"
        exit 1
      fi
    - cd $WDIO_WORKING_DIRECTORY
    - npm ci
  script:
    - npm run test:e2e
  variables:
    BASE_URL: $WDIO_BASE_URL
    MAX_INSTANCES: $WDIO_MAX_INSTANCES
    HEADLESS: "true"
  artifacts:
    when: always
    paths:
      - $WDIO_WORKING_DIRECTORY/test-results/
      - $WDIO_WORKING_DIRECTORY/allure-results/
    reports:
      junit: $WDIO_WORKING_DIRECTORY/test-results/*.xml
    expire_in: 7 days

# Job variant for cloud execution (BrowserStack/SauceLabs)
.webdriverio-e2e-cloud:
  stage: test
  image: node:${WDIO_NODE_VERSION}-slim
  before_script:
    - |
      if [ ! -d "$WDIO_WORKING_DIRECTORY" ]; then
        echo "ERROR: WebDriverIO directory not found at $WDIO_WORKING_DIRECTORY"
        exit 1
      fi
    - cd $WDIO_WORKING_DIRECTORY
    - npm ci
  script:
    - npm run test:e2e:cloud
  variables:
    BASE_URL: $WDIO_BASE_URL
    MAX_INSTANCES: $WDIO_MAX_INSTANCES
    # These should be set as CI/CD variables in GitLab
    # BROWSERSTACK_USERNAME: <from CI/CD variables>
    # BROWSERSTACK_ACCESS_KEY: <from CI/CD variables>
  artifacts:
    when: always
    paths:
      - $WDIO_WORKING_DIRECTORY/test-results/
      - $WDIO_WORKING_DIRECTORY/allure-results/
    reports:
      junit: $WDIO_WORKING_DIRECTORY/test-results/*.xml
    expire_in: 7 days
