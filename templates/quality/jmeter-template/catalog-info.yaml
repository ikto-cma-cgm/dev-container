# Resource entity representing the JMeter load testing capability
# This can be referenced by application components via dependsOn
#
# Note: The Template entity is defined in template.yaml, not here
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: jmeter-load-testing
  title: JMeter Load Testing Capability
  description: |
    Dockerized load and performance testing capability using Apache JMeter.
    Provides HTTP/API stress testing for performance validation.
  tags:
    - testing
    - performance
    - load-testing
    - quality
    - stress-testing
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://jmeter.apache.org/usermanual/
      title: JMeter User Manual
      icon: docs
    - url: https://jmeter.apache.org/usermanual/best-practices.html
      title: JMeter Best Practices
      icon: star
spec:
  type: testing-service
  owner: quality-team
