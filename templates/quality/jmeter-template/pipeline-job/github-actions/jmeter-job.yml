# JMeter Load Tests - Reusable Workflow
# This workflow is designed to be called from a main CI/CD pipeline
# It expects the jmeter/ directory to exist in the repository

name: JMeter Load Tests

on:
  workflow_call:
    inputs:
      target_host:
        description: 'Target host to test (without protocol)'
        required: true
        type: string
      target_port:
        description: 'Target port'
        required: false
        type: string
        default: '8080'
      target_protocol:
        description: 'Protocol (http or https)'
        required: false
        type: string
        default: 'http'
      working_directory:
        description: 'Path to jmeter directory'
        required: false
        type: string
        default: 'jmeter'
      test_plan:
        description: 'Test plan file to execute'
        required: false
        type: string
        default: 'test-plans/load-test.jmx'
      threads:
        description: 'Number of virtual users (threads)'
        required: false
        type: number
        default: 10
      duration:
        description: 'Test duration in seconds'
        required: false
        type: number
        default: 60
      ramp_up:
        description: 'Ramp-up period in seconds'
        required: false
        type: number
        default: 10
      upload_artifacts:
        description: 'Upload test artifacts (reports, results)'
        required: false
        type: boolean
        default: true
      fail_on_error:
        description: 'Fail the workflow if tests fail'
        required: false
        type: boolean
        default: false
      performance_threshold:
        description: 'Max acceptable error rate percentage'
        required: false
        type: number
        default: 5
    outputs:
      test_result:
        description: 'Test execution result (success/failure)'
        value: ${{ jobs.load-tests.outputs.result }}
      report_url:
        description: 'URL to test report (if available)'
        value: ${{ jobs.load-tests.outputs.report_url }}
      avg_response_time:
        description: 'Average response time in ms'
        value: ${{ jobs.load-tests.outputs.avg_response_time }}
      error_rate:
        description: 'Error rate percentage'
        value: ${{ jobs.load-tests.outputs.error_rate }}

jobs:
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run-tests.outcome }}
      report_url: ${{ steps.upload-report.outputs.artifact-url }}
      avg_response_time: ${{ steps.analyze-results.outputs.avg_response_time }}
      error_rate: ${{ steps.analyze-results.outputs.error_rate }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify JMeter setup exists
        run: |
          if [ ! -d "${{ inputs.working_directory }}" ]; then
            echo "::error::JMeter directory not found at ${{ inputs.working_directory }}"
            echo "Please ensure the JMeter template has been applied to this repository."
            exit 1
          fi
          echo "JMeter setup found at ${{ inputs.working_directory }}"

      - name: Run Load Tests
        id: run-tests
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "Running JMeter load tests..."
          echo "  Target: ${{ inputs.target_protocol }}://${{ inputs.target_host }}:${{ inputs.target_port }}"
          echo "  Threads: ${{ inputs.threads }}"
          echo "  Duration: ${{ inputs.duration }}s"
          echo "  Ramp-up: ${{ inputs.ramp_up }}s"

          docker-compose up --build --abort-on-container-exit --exit-code-from jmeter
        env:
          TARGET_HOST: ${{ inputs.target_host }}
          TARGET_PORT: ${{ inputs.target_port }}
          TARGET_PROTOCOL: ${{ inputs.target_protocol }}
          THREADS: ${{ inputs.threads }}
          DURATION: ${{ inputs.duration }}
          RAMP_UP: ${{ inputs.ramp_up }}
          TEST_PLAN: ${{ inputs.test_plan }}
        continue-on-error: true

      - name: Analyze Results
        id: analyze-results
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "Analyzing test results..."

          # Parse JTL results if they exist
          if [ -f "results/results.jtl" ]; then
            # Calculate basic metrics (simplified)
            TOTAL_REQUESTS=$(wc -l < results/results.jtl)
            ERROR_COUNT=$(grep -c ",false," results/results.jtl || echo "0")

            if [ "$TOTAL_REQUESTS" -gt 1 ]; then
              ERROR_RATE=$(echo "scale=2; ($ERROR_COUNT / ($TOTAL_REQUESTS - 1)) * 100" | bc)
            else
              ERROR_RATE="0"
            fi

            echo "Total Requests: $TOTAL_REQUESTS"
            echo "Error Count: $ERROR_COUNT"
            echo "Error Rate: ${ERROR_RATE}%"

            echo "error_rate=${ERROR_RATE}" >> $GITHUB_OUTPUT
            echo "avg_response_time=N/A" >> $GITHUB_OUTPUT

            # Check against threshold
            if (( $(echo "$ERROR_RATE > ${{ inputs.performance_threshold }}" | bc -l) )); then
              echo "::warning::Error rate ${ERROR_RATE}% exceeds threshold ${{ inputs.performance_threshold }}%"
              if [ "${{ inputs.fail_on_error }}" = "true" ]; then
                exit 1
              fi
            fi
          else
            echo "No results file found"
            echo "error_rate=N/A" >> $GITHUB_OUTPUT
            echo "avg_response_time=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Upload HTML Report
        id: upload-report
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JTL Results
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup Docker
        if: always()
        working-directory: ${{ inputs.working_directory }}
        run: docker-compose down -v || true

      - name: Test Summary
        if: always()
        run: |
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ inputs.target_protocol }}://${{ inputs.target_host }}:${{ inputs.target_port }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Virtual Users**: ${{ inputs.threads }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ inputs.duration }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Error Rate**: ${{ steps.analyze-results.outputs.error_rate }}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: ${{ steps.run-tests.outcome }}" >> $GITHUB_STEP_SUMMARY
