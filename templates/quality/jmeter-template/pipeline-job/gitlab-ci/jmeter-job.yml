# JMeter Load Tests - GitLab CI Job Template
# This job template is designed to be included in a main .gitlab-ci.yml
# It expects the jmeter/ directory to exist in the repository
#
# Usage in your .gitlab-ci.yml:
# include:
#   - local: 'jmeter/.gitlab-ci-job.yml'
#
# Or extend the job:
# load-tests:
#   extends: .jmeter-load-tests
#   variables:
#     TARGET_HOST: "api.example.com"

variables:
  JMETER_WORKING_DIRECTORY: "jmeter"
  JMETER_TARGET_HOST: "localhost"
  JMETER_TARGET_PORT: "8080"
  JMETER_TARGET_PROTOCOL: "http"
  JMETER_THREADS: "10"
  JMETER_DURATION: "60"
  JMETER_RAMP_UP: "10"
  JMETER_TEST_PLAN: "test-plans/load-test.jmx"
  JMETER_PERFORMANCE_THRESHOLD: "5"

# Base job template for JMeter Load Tests
.jmeter-load-tests:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - |
      if [ ! -d "$JMETER_WORKING_DIRECTORY" ]; then
        echo "ERROR: JMeter directory not found at $JMETER_WORKING_DIRECTORY"
        echo "Please ensure the JMeter template has been applied to this repository."
        exit 1
      fi
      echo "JMeter setup found at $JMETER_WORKING_DIRECTORY"
      echo "Target: ${JMETER_TARGET_PROTOCOL}://${JMETER_TARGET_HOST}:${JMETER_TARGET_PORT}"
      echo "Threads: ${JMETER_THREADS}, Duration: ${JMETER_DURATION}s"
  script:
    - cd $JMETER_WORKING_DIRECTORY
    - |
      export TARGET_HOST=$JMETER_TARGET_HOST
      export TARGET_PORT=$JMETER_TARGET_PORT
      export TARGET_PROTOCOL=$JMETER_TARGET_PROTOCOL
      export THREADS=$JMETER_THREADS
      export DURATION=$JMETER_DURATION
      export RAMP_UP=$JMETER_RAMP_UP
      export TEST_PLAN=$JMETER_TEST_PLAN

      echo "Running JMeter load tests..."
      docker-compose up --build --abort-on-container-exit --exit-code-from jmeter || true
    - |
      # Analyze results
      if [ -f "results/results.jtl" ]; then
        TOTAL_REQUESTS=$(wc -l < results/results.jtl)
        ERROR_COUNT=$(grep -c ",false," results/results.jtl || echo "0")

        if [ "$TOTAL_REQUESTS" -gt 1 ]; then
          ERROR_RATE=$(echo "scale=2; ($ERROR_COUNT / ($TOTAL_REQUESTS - 1)) * 100" | bc)
        else
          ERROR_RATE="0"
        fi

        echo "Total Requests: $TOTAL_REQUESTS"
        echo "Error Count: $ERROR_COUNT"
        echo "Error Rate: ${ERROR_RATE}%"

        # Check against threshold
        THRESHOLD_CHECK=$(echo "$ERROR_RATE > $JMETER_PERFORMANCE_THRESHOLD" | bc -l)
        if [ "$THRESHOLD_CHECK" = "1" ]; then
          echo "WARNING: Error rate ${ERROR_RATE}% exceeds threshold ${JMETER_PERFORMANCE_THRESHOLD}%"
        fi
      fi
  after_script:
    - cd $JMETER_WORKING_DIRECTORY && docker-compose down -v || true
  artifacts:
    when: always
    paths:
      - $JMETER_WORKING_DIRECTORY/reports/
      - $JMETER_WORKING_DIRECTORY/results/
    expire_in: 14 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true

# Concrete job for load testing
jmeter-load-test:
  extends: .jmeter-load-tests

# Job variant for smoke testing (quick validation)
.jmeter-smoke-test:
  extends: .jmeter-load-tests
  variables:
    JMETER_THREADS: "1"
    JMETER_DURATION: "10"
    JMETER_RAMP_UP: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job variant for stress testing
.jmeter-stress-test:
  extends: .jmeter-load-tests
  variables:
    JMETER_THREADS: "100"
    JMETER_DURATION: "300"
    JMETER_RAMP_UP: "30"
  rules:
    - when: manual
      allow_failure: true

# Job variant for endurance testing
.jmeter-endurance-test:
  extends: .jmeter-load-tests
  variables:
    JMETER_THREADS: "20"
    JMETER_DURATION: "1800"
    JMETER_RAMP_UP: "60"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
