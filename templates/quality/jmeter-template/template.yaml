apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: jmeter-template
  title: ⚡ JMeter Load Testing
  description: Add HTTP/API load testing to your project in 2 minutes - Zero config needed!
  tags:
    - quality
    - testing
    - performance
    - load-testing
    - jmeter
    - recommended
spec:
  owner: quality-team
  type: quality-service

  parameters:
    - title: 🚀 Get Started - Just 3 Questions!
      description: Add load testing to your project in minutes. Everything else has smart defaults.
      required:
        - projectName
        - repoUrl
        - targetUrl
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name of your project
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
          ui:placeholder: 'my-awesome-api'

        repoUrl:
          title: Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

        targetUrl:
          title: Target API URL
          type: string
          description: The API endpoint to test
          default: 'http://localhost:8080'
          ui:placeholder: 'http://localhost:8080'
          ui:help: 'We will test this endpoint. Change it later in .env or docker-compose.yml'

    - title: ⚙️ Advanced Options (Optional)
      description: 'Smart defaults: 10 threads, 60s duration, HTML reports. Expand to customize.'
      properties:
        includeExampleTests:
          title: Include Example Test Plans
          type: boolean
          description: Generate comprehensive test examples (simple GET/POST, ramp-up)
          default: true
          ui:help: 'Recommended - Learn by example!'

        defaultThreads:
          title: Default Thread Count
          type: number
          description: Number of virtual users (threads)
          default: 10
          minimum: 1
          maximum: 1000
          ui:help: 'Start low and increase gradually'

        defaultDuration:
          title: Default Test Duration (seconds)
          type: number
          description: How long to run tests
          default: 60
          minimum: 10
          maximum: 3600

        runOnPR:
          title: Run Tests on Pull Requests
          type: boolean
          description: Automatically run load tests when PR is created
          default: false
          ui:help: 'Usually disabled for load tests to save resources'

        runScheduled:
          title: Run Scheduled Tests
          type: boolean
          description: Run load tests nightly
          default: false

  steps:
    - id: fetch-template
      name: Fetch JMeter Configuration
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./jmeter
        values:
          # User-provided values
          projectName: ${{ parameters.projectName }}
          targetUrl: ${{ parameters.targetUrl }}

          # Optional advanced settings (with fallbacks)
          defaultThreads: ${{ parameters.defaultThreads or 10 }}
          defaultDuration: ${{ parameters.defaultDuration or 60 }}
          runOnPR: ${{ parameters.runOnPR or false }}
          runScheduled: ${{ parameters.runScheduled or false }}
          includeExampleTests: ${{ parameters.includeExampleTests !== false }}

          # Testing defaults
          testType: load
          defaultRampUp: 10

          # Reporting defaults
          generateReport: true
          reportFormat: html

          # CI/CD defaults
          scheduleCron: '0 2 * * *'

    - id: publish
      name: Create Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: add-jmeter-testing
        title: "⚡ Add Load Testing with JMeter"
        description: |
          # 🎉 Load Testing Setup Complete!

          This PR adds **JMeter load testing** to your project with everything pre-configured!

          ## ✨ What's Included

          - ✅ **Dockerized environment** - Java 17, JMeter 5.6.3 all containerized
          - ✅ **Zero local dependencies** - Everything runs in Docker
          - ✅ **HTTP/API load testing** optimized for REST endpoints
          - ✅ **HTML Dashboard reports** for beautiful test results{% if parameters.includeExampleTests %}
          - ✅ **Example test plans** (simple load test, ramp-up test){% endif %}
          - ✅ **CI/CD integration** - Tests run on demand or scheduled

          ## 🚀 Quick Start

          ```bash
          cd jmeter
          # Run your first load test
          TARGET_HOST=your-api.com docker-compose up
          ```

          That's it! The first run builds the Docker image (takes 2-3 min), then subsequent runs are instant.

          ## 📊 Configuration

          - **Target**: {{ parameters.targetUrl }}
          - **Threads**: {{ parameters.defaultThreads }} virtual users
          - **Duration**: {{ parameters.defaultDuration }}s
          - **CI/CD**: {% if parameters.runOnPR %}✅ Runs on PRs{% else %}❌{% endif %} • {% if parameters.runScheduled %}✅ Nightly builds{% else %}❌{% endif %}

          ## 📚 Next Steps

          1. **Merge this PR** to add load testing to your project
          2. **Customize test plans** in `jmeter/test-plans/`
          3. **Run locally** with `docker-compose up`
          4. **View reports** at `jmeter/reports/index.html`

          ## 🔧 Useful Commands

          ```bash
          # Run tests with custom settings
          TARGET_HOST=staging.com THREADS=50 DURATION=120 docker-compose up

          # Access container shell for debugging
          docker-compose run jmeter bash

          # Generate report from existing results
          docker-compose run jmeter jmeter -g results/results.jtl -o reports/
          ```

          ## 🆘 Need Help?

          - 📖 See `jmeter/README.md` for full documentation
          - 💬 Ask on Slack: #quality-platform
          - 📧 Email: quality-platform-team@your-company.com

          ---

          🤖 Generated by JMeter Load Testing Template
          🏆 Maintained by Quality Platform Team

  output:
    links:
      - title: 🎉 View Pull Request
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 📖 JMeter Documentation
        icon: docs
        url: https://jmeter.apache.org/usermanual/
      - title: 💬 Get Help
        icon: chat
        url: https://slack.com/app_redirect?channel=quality-platform
    text:
      - title: ✅ Load Testing Added Successfully!
        content: |
          Your pull request is ready! 🎉

          ## 🚀 What's Next?

          **1. Review & Merge the PR**
          → ${{ steps.publish.output.remoteUrl }}

          **2. Try it locally**
          ```bash
          cd jmeter
          TARGET_HOST=localhost TARGET_PORT=8080 docker-compose up
          ```

          First run builds the Docker image (2-3 min), then it's instant!

          **3. View the HTML report**
          Open `jmeter/reports/index.html` in your browser

          ## 📊 Your Setup

          - ✅ Target: **{{ parameters.targetUrl }}**
          - ✅ Threads: **{{ parameters.defaultThreads }} virtual users**
          - ✅ Duration: **{{ parameters.defaultDuration }}s**
          - ✅ CI/CD: **{% if parameters.runOnPR %}Runs on PRs{% else %}Manual only{% endif %}**{% if parameters.runScheduled %}
          - ✅ Scheduled: **Nightly at 2 AM**{% endif %}

          ## 💡 Pro Tips

          - Customize thread count: `THREADS=50 docker-compose up`
          - Change duration: `DURATION=300 docker-compose up`
          - Test different environments: `TARGET_HOST=staging.com docker-compose up`
          - All tests run in Docker - no Java/JMeter installation needed!

          ## 🆘 Need Help?

          - 📖 Full docs in `jmeter/README.md`
          - 💬 Slack: #quality-platform
          - 📧 quality-platform-team@your-company.com

          Happy testing! ⚡
