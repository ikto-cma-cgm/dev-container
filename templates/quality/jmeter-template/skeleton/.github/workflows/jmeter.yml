name: JMeter Load Tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to test'
        required: true
        default: '${{ values.targetUrl }}'
      threads:
        description: 'Number of threads'
        required: false
        default: '${{ values.defaultThreads }}'
      duration:
        description: 'Test duration (seconds)'
        required: false
        default: '${{ values.defaultDuration }}'
{% if values.runOnPR %}
  pull_request:
    branches:
      - main
      - master
      - develop
{% endif %}
{% if values.runScheduled %}
  schedule:
    - cron: '${{ values.scheduleCron }}'  # Nightly at 2 AM
{% endif %}

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          # Parse target URL
          TARGET_URL="${{ github.event.inputs.target_url || '${{ values.targetUrl }}' }}"

          # Extract host, port, protocol
          if [[ $TARGET_URL =~ ^https:// ]]; then
            echo "TARGET_PROTOCOL=https" >> $GITHUB_ENV
            TARGET_URL=${TARGET_URL#https://}
          else
            echo "TARGET_PROTOCOL=http" >> $GITHUB_ENV
            TARGET_URL=${TARGET_URL#http://}
          fi

          if [[ $TARGET_URL =~ : ]]; then
            echo "TARGET_HOST=${TARGET_URL%:*}" >> $GITHUB_ENV
            echo "TARGET_PORT=${TARGET_URL#*:}" >> $GITHUB_ENV
          else
            echo "TARGET_HOST=$TARGET_URL" >> $GITHUB_ENV
            echo "TARGET_PORT=$([[ ${{ env.TARGET_PROTOCOL }} == 'https' ]] && echo '443' || echo '80')" >> $GITHUB_ENV
          fi

          echo "THREADS=${{ github.event.inputs.threads || values.defaultThreads }}" >> $GITHUB_ENV
          echo "DURATION=${{ github.event.inputs.duration || values.defaultDuration }}" >> $GITHUB_ENV

      - name: Run JMeter tests
        run: |
          cd jmeter
          docker-compose up --build --abort-on-container-exit

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: jmeter/reports/
          retention-days: 7

      - name: Upload JTL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: jmeter/results/*.jtl
          retention-days: 7

      - name: Check test results
        if: success()
        run: |
          echo "✅ Load tests completed successfully!"
          echo "📊 View the HTML report in the artifacts"
