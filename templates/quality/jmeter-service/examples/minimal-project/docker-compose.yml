version: '3.8'

services:
  jmeter:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: jmeter-service:latest
    container_name: jmeter-example
    env_file:
      - .env
    environment:
      - TARGET_HOST=${TARGET_HOST:-host.docker.internal}
      - TARGET_PORT=${TARGET_PORT:-8080}
      - TARGET_PROTOCOL=${TARGET_PROTOCOL:-http}
      - THREADS=${THREADS:-10}
      - RAMP_UP=${RAMP_UP:-10}
      - DURATION=${DURATION:-60}
      - TEST_PLAN=${TEST_PLAN:-api/simple-load-test.jmx}
      - GENERATE_REPORT=${GENERATE_REPORT:-true}
    volumes:
      - ./test-plans:/jmeter/test-plans:ro
      - ./test-data:/jmeter/test-data:ro
      - ./results:/jmeter/results:rw
      - ./reports:/jmeter/reports:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
