version: '3.8'

# JMeter Load Testing Service
# Cross-platform compatible (Mac/Linux/Windows)

services:
  jmeter-tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: jmeter-service:latest
    container_name: jmeter-tests
    environment:
      # Target application configuration
      - TARGET_HOST=${TARGET_HOST:-host.docker.internal}
      - TARGET_PORT=${TARGET_PORT:-8080}
      - TARGET_PROTOCOL=${TARGET_PROTOCOL:-http}
      # Load configuration
      - THREADS=${THREADS:-10}
      - RAMP_UP=${RAMP_UP:-10}
      - DURATION=${DURATION:-60}
      # Execution options
      - TEST_PLAN=${TEST_PLAN:-}
      - GENERATE_REPORT=${GENERATE_REPORT:-true}
      # JVM configuration
      - HEAP=${HEAP:--Xms1g -Xmx1g -XX:MaxMetaspaceSize=256m}
      # Timezone
      - TZ=${TZ:-Europe/Paris}
    volumes:
      # Mount test plans
      - ./examples/minimal-project/test-plans:/jmeter/test-plans:ro
      # Mount test data
      - ./examples/minimal-project/test-data:/jmeter/test-data:ro
      # Mount results (read-write)
      - ./examples/minimal-project/results:/jmeter/results:rw
      # Mount reports (read-write)
      - ./examples/minimal-project/reports:/jmeter/reports:rw
      # Optional: custom configuration
      - ./examples/minimal-project/config:/jmeter/config:ro
    # Network configuration for accessing host services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Resource limits (adjust based on needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - jmeter-network

  # Optional: InfluxDB for real-time monitoring
  influxdb:
    image: influxdb:2.7-alpine
    container_name: jmeter-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpass
      - DOCKER_INFLUXDB_INIT_ORG=jmeter
      - DOCKER_INFLUXDB_INIT_BUCKET=jmeter
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - jmeter-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: jmeter-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - jmeter-network
    profiles:
      - monitoring

volumes:
  influxdb-data:
  grafana-data:

networks:
  jmeter-network:
    name: jmeter-network
    driver: bridge
