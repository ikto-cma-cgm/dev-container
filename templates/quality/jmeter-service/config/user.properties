# ===============================================
# User Properties - Custom Configuration
# JMeter Load Testing Service
# Quality Platform Team
# ===============================================

# This file contains user-defined properties that can be referenced
# in test plans using ${__P(property,default)} or ${__property(property,default)}

# ===============================================
# Target Configuration (can be overridden via -J command line)
# ===============================================

# Target server configuration
target.host=localhost
target.port=8080
target.protocol=http
target.path=/

# ===============================================
# Load Configuration
# ===============================================

# Thread Group defaults
threads=10
rampup=10
duration=60

# Think time between requests (milliseconds)
think.time.min=1000
think.time.max=3000

# ===============================================
# Test Data Configuration
# ===============================================

# CSV data file locations (relative to /jmeter/test-data)
csv.users=/jmeter/test-data/users.csv
csv.testdata=/jmeter/test-data/test-data.csv

# CSV configuration
csv.delimiter=,
csv.recycle=true
csv.stopThread=false
csv.shareMode=shareMode.all

# ===============================================
# HTTP Configuration
# ===============================================

# HTTP headers
http.header.content_type=application/json
http.header.accept=application/json

# Connection configuration
http.connection.timeout=10000
http.response.timeout=30000

# Keep-alive
http.keepalive=true

# ===============================================
# Assertion Configuration
# ===============================================

# Expected response codes
assertion.response.code=200
assertion.response.codes=200,201,202,204

# Response time thresholds (milliseconds)
assertion.response.time.warning=1000
assertion.response.time.error=3000

# ===============================================
# Reporting Configuration
# ===============================================

# Percentiles to calculate
percentile.1=90
percentile.2=95
percentile.3=99

# ===============================================
# Environment-Specific Overrides
# ===============================================

# These can be overridden via environment variables or -J flags
# Example: jmeter -Jtarget.host=staging.example.com -Jthreads=50 -n -t test.jmx

# Development environment
#dev.target.host=localhost
#dev.target.port=8080

# Staging environment
#staging.target.host=staging.example.com
#staging.target.port=443
#staging.target.protocol=https

# Production environment (use with extreme caution!)
#prod.target.host=api.example.com
#prod.target.port=443
#prod.target.protocol=https
