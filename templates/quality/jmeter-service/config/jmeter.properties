# ===============================================
# JMeter Properties - Base Configuration
# JMeter Load Testing Service
# Quality Platform Team
# ===============================================

# Language
language=en

# ===============================================
# Logging Configuration
# ===============================================

# Log level for JMeter: DEBUG, INFO, WARN, ERROR, FATAL
log_level.jmeter=INFO
log_level.jorphan=INFO

# Log level for components
log_level.jmeter.control=INFO
log_level.jmeter.testbeans=INFO
log_level.jmeter.engine=INFO
log_level.jmeter.threads=INFO
log_level.jmeter.gui=WARN
log_level.jmeter.testelement=INFO
log_level.jmeter.util=WARN
log_level.jmeter.protocol.http=INFO

# Log file
#jmeterlogfile=jmeter.log

# ===============================================
# Reporting Configuration
# ===============================================

# Configure the HTML report generator

# Configure this property to change the report title
#jmeter.reportgenerator.report_title=Apache JMeter Dashboard

# Export Dashboard generation
jmeter.reportgenerator.exporter.html.classname=org.apache.jmeter.report.dashboard.HtmlTemplateExporter

# Indicates which result file keys are aggregated
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500

# Sets the destination directory for generated html pages
jmeter.reportgenerator.exporter.html.property.output_dir=/jmeter/reports

# ===============================================
# Result File Configuration
# ===============================================

# Results file format: xml or csv (default)
jmeter.save.saveservice.output_format=csv

# What to save in results
jmeter.save.saveservice.assertion_results=all
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.encoding=false
jmeter.save.saveservice.hostname=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.message=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.url=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.idle_time=true

# ===============================================
# HTTP Configuration
# ===============================================

# HTTP cache
httpclient.reset_state_on_thread_group_iteration=true

# HTTP connection
hc.parameters.file=hc.parameters

# Maximum connection retries
httpclient.retrycount=0

# Connection and response timeouts (milliseconds)
httpclient.timeout=10000

# ===============================================
# Performance Configuration
# ===============================================

# Number of threads used by JMeter for asynchronous tasks
jmeterengine.nongui.maxport=4460

# Should JMeter automatically expand tree structure when a thread group is added
onload.expandtree=false

# ===============================================
# Remote Testing Configuration
# ===============================================

# Remote hosts and RMI configuration
#remote_hosts=127.0.0.1
#server_port=1099

# ===============================================
# Miscellaneous Configuration
# ===============================================

# JSR223 compilation cache
jsr223.cache_compilation=true

# Groovy compilation cache
groovy.utilities.cacheDir=/tmp/groovy

# Allow override via command line (-J params)
# These properties can be overridden by using -J<property>=<value> on command line
