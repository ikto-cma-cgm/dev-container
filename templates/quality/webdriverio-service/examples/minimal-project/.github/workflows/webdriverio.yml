name: WebdriverIO E2E Tests

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  e2e-tests-dockerized:
    name: E2E Tests (Dockerized)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker-compose -f webdriver-io/docker-compose.yml build

      - name: Run tests in Docker
        run: docker-compose -f webdriver-io/docker-compose.yml up --abort-on-container-exit --exit-code-from wdio-tests

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-dockerized
          path: webdriver-io/test-results/screenshots/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-dockerized
          path: webdriver-io/allure-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker-compose -f webdriver-io/docker-compose.yml down -v

  generate-allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [e2e-tests-dockerized]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: webdriver-io/allure-results
          merge-multiple: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: webdriver-io/allure-results
          allure_history: webdriver-io/allure-history

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webdriver-io/allure-history
          destination_dir: allure-report
