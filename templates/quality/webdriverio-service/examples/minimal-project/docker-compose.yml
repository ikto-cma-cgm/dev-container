# Docker Compose for WebdriverIO E2E Tests
# Project: my-awesome-app
#
# Quick Start:
#   docker-compose up wdio-tests          # Run tests (exits after completion)
#   docker-compose up -d wdio-tests       # Run in background
#   docker-compose run wdio-tests bash    # Interactive shell for debugging
#
# Environment variables can be overridden:
#   BASE_URL=https://staging.com docker-compose up wdio-tests

version: '3.8'

services:
  # WebdriverIO Test Runner
  wdio-tests:
    build:
      context: .
      dockerfile: Dockerfile.wdio
    image: my-awesome-app-wdio-tests:latest
    container_name: my-awesome-app-wdio-tests

    # Environment configuration
    environment:
      # Application URL - Override with: BASE_URL=https://your-url docker-compose up
      - BASE_URL=${BASE_URL:-http://localhost:3000}

      # Browser configuration
      - BROWSER=${BROWSER:-chrome}
      - HEADLESS=${HEADLESS:-true}

      # Test execution
      - MAX_INSTANCES=${MAX_INSTANCES:-5}
      - TEST_TIMEOUT=${TEST_TIMEOUT:-60000}
      - TEST_FRAMEWORK=${TEST_FRAMEWORK:-mocha}

      # Advanced options
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Paris}

    # Volume mounts
    volumes:
      # Test results (read-write) - shared with host for easy access
      - ./test-results:/tests/test-results:rw
      - ./allure-results:/tests/allure-results:rw

    # Network configuration
    # Allows tests to access services on host (e.g., http://host.docker.internal:3000)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Shared memory size (prevents Chrome crashes)
    shm_size: '2gb'

    # Resource limits (optional - adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

# Network
networks:
  default:
    name: my-awesome-app-wdio-network
