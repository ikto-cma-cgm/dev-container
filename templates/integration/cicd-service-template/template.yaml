apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: unified-cicd-template
  title: Unified CI/CD Pipeline
  description: |
    Generate a production-ready CI/CD pipeline customized for your service stack.
    Optionally integrate E2E tests (WebDriverIO) and load tests (JMeter).
  tags:
    - integration
    - cicd
    - github-actions
    - jenkins
    - gitlab-ci
    - automation
    - quality
spec:
  owner: platform-team
  type: pipeline

  parameters:
    - title: Project Configuration
      required:
        - repoUrl
        - projectType
        - ciProvider
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

        projectType:
          title: Project Type
          type: string
          description: Select your project technology stack
          enum:
            - nodejs
            - react
            - java
          enumNames:
            - Node.js Service
            - React/Next.js Application
            - Java/Spring Boot Service

        ciProvider:
          title: CI/CD Provider
          type: string
          description: Select your CI/CD platform
          default: github-actions
          enum:
            - github-actions
            - jenkins
            - gitlab-ci

        deploymentTarget:
          title: Deployment Target
          type: string
          default: kubernetes
          enum:
            - kubernetes
            - cloud-run
            - aws-ecs
            - vercel
            - none

      dependencies:
        projectType:
          oneOf:
            - properties:
                projectType:
                  enum:
                    - nodejs
                    - react
                nodeVersion:
                  title: Node.js Version
                  type: string
                  description: Runtime version for Node.js/React projects
                  default: '18.x'
                  enum: ['18.x', '20.x', '22.x']
                  ui:widget: select
              required:
                - nodeVersion
            - properties:
                projectType:
                  enum:
                    - java
                javaVersion:
                  title: Java Version
                  type: string
                  description: JDK version for Java projects
                  default: '17'
                  enum: ['17', '21']
                  ui:widget: select
              required:
                - javaVersion

    - title: Quality Testing Integration
      description: |
        Integrate quality testing tools into your pipeline.

        **Prerequisites:** These options require the test setup to exist in your repository.
        Use the dedicated templates first if needed.
      properties:
        enableSonarQube:
          title: Enable SonarQube
          type: boolean
          description: Add SonarQube code quality analysis
          default: false

        enableWebDriverIO:
          title: Enable WebDriverIO E2E Tests
          type: boolean
          description: |
            Add E2E browser testing stage.
            Requires webdriver-io/ directory in your repository.
          default: false
          ui:help: |
            No setup yet? Use the WebDriverIO template first:
            /create/templates/default/webdriverio-template

        enableJMeter:
          title: Enable JMeter Load Tests
          type: boolean
          description: |
            Add load/performance testing stage.
            Requires jmeter/ directory in your repository.
          default: false
          ui:help: |
            No setup yet? Use the JMeter template first:
            /create/templates/default/jmeter-template

        wdioBaseUrl:
          title: E2E Test Base URL
          type: string
          description: URL where your application runs for E2E testing
          default: 'http://localhost:3000'
          ui:options:
            dependencies:
              enableWebDriverIO: true

        jmeterTargetHost:
          title: Load Test Target Host
          type: string
          description: API host for load testing (without protocol)
          default: 'localhost'
          ui:options:
            dependencies:
              enableJMeter: true

  steps:
    - id: fetch-base
      name: Fetch Pipeline Template
      action: fetch:template
      input:
        url: ./skeleton/${{ parameters.projectType }}/${{ parameters.ciProvider }}
        values:
          appName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          serviceName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          nodeVersion: ${{ parameters.nodeVersion }}
          javaVersion: ${{ parameters.javaVersion }}
          deploymentTarget: ${{ parameters.deploymentTarget }}
          defaultBranch: main
          # Standard pipeline flags
          enableCICD: true
          runLint: true
          runTests: true
          enableDocker: true
          enableSecurityScan: true
          # Quality testing flags
          enableSonarQube: ${{ parameters.enableSonarQube }}
          enableWebDriverIO: ${{ parameters.enableWebDriverIO }}
          enableJMeter: ${{ parameters.enableJMeter }}
          wdioBaseUrl: ${{ parameters.wdioBaseUrl }}
          jmeterTargetHost: ${{ parameters.jmeterTargetHost }}

    - id: publish
      name: Create Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: add-cicd-pipeline
        title: "Configure CI/CD Pipeline{% if parameters.enableWebDriverIO or parameters.enableJMeter %} with Quality Testing{% endif %}"
        description: |
          # CI/CD Pipeline Configuration

          This PR adds a CI/CD pipeline for **${{ parameters.projectType }}** using **${{ parameters.ciProvider }}**.

          ## Configuration

          | Setting | Value |
          |---------|-------|
          | Project Type | ${{ parameters.projectType }} |
          | CI Provider | ${{ parameters.ciProvider }} |
          | Deployment Target | ${{ parameters.deploymentTarget }} |

          ## Quality Testing Integration

          | Tool | Enabled |
          |------|---------|
          | SonarQube | ${{ parameters.enableSonarQube }} |
          | WebDriverIO E2E | ${{ parameters.enableWebDriverIO }} |
          | JMeter Load Tests | ${{ parameters.enableJMeter }} |

          {% if parameters.enableWebDriverIO %}
          ### WebDriverIO Configuration
          - Base URL: `${{ parameters.wdioBaseUrl }}`
          - **Requires**: `webdriver-io/` directory (use WebDriverIO template)
          {% endif %}

          {% if parameters.enableJMeter %}
          ### JMeter Configuration
          - Target Host: `${{ parameters.jmeterTargetHost }}`
          - **Requires**: `jmeter/` directory (use JMeter template)
          {% endif %}

          ---
          Generated by **Unified CI/CD Pipeline Template**

  output:
    links:
      - title: View Pull Request
        url: ${{ steps.publish.output.remoteUrl }}
        icon: github

      - title: WebDriverIO Template
        icon: scaffolder
        url: /create/templates/default/webdriverio-template

      - title: JMeter Template
        icon: scaffolder
        url: /create/templates/default/jmeter-template

    text:
      - title: Pipeline Created
        content: |
          Your CI/CD pipeline has been configured!

          ## Next Steps

          1. **Review and merge** the PR
          2. **Configure required secrets** in repository settings

          {% if parameters.enableWebDriverIO %}
          ### WebDriverIO E2E Tests

          Your pipeline includes E2E tests. Make sure the `webdriver-io/` directory exists.

          **No setup yet?** [Create WebDriverIO Setup](/create/templates/default/webdriverio-template)
          {% endif %}

          {% if parameters.enableJMeter %}
          ### JMeter Load Tests

          Your pipeline includes load tests. Make sure the `jmeter/` directory exists.

          **No setup yet?** [Create JMeter Setup](/create/templates/default/jmeter-template)
          {% endif %}
