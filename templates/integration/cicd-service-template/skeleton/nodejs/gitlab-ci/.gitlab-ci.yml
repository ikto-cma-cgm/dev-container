variables:
  NODE_VERSION: '${NODE_VERSION}'
  SERVICE_NAME: '${SERVICE_NAME}'
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Define stages
stages:
  - install
  - lint
  - test
  - security
  - build
  - docker
  - deploy

# Cache node_modules
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# Default before_script
default:
  before_script:
    - node --version
    - npm --version

# Install dependencies
install:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 day

# Linting
lint:
  stage: lint
  image: node:${NODE_VERSION}
  rules:
    - if: '${RUN_LINT}' == 'true'
  dependencies:
    - install
  script:
    - npm run lint

# Unit Tests
test:
  stage: test
  image: node:${NODE_VERSION}
  services:
    # PostgreSQL service
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: test_db
      rules:
        - if: '${REQUIRES_DATABASE}' == 'true' && '${DATABASE_TYPE}' == 'postgresql'

    # MongoDB service
    - name: mongo:7
      alias: mongo
      rules:
        - if: '${REQUIRES_DATABASE}' == 'true' && '${DATABASE_TYPE}' == 'mongodb'

    # MySQL service
    - name: mysql:8
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: test_db
      rules:
        - if: '${REQUIRES_DATABASE}' == 'true' && '${DATABASE_TYPE}' == 'mysql'

    # Redis service
    - name: redis:7-alpine
      alias: redis
      rules:
        - if: '${REQUIRES_REDIS}' == 'true'

  variables:
    DATABASE_URL: >-
      $(
        if [ "${DATABASE_TYPE}" = "postgresql" ]; then
          echo "postgresql://postgres:postgres@postgres:5432/test_db";
        elif [ "${DATABASE_TYPE}" = "mongodb" ]; then
          echo "mongodb://mongo:27017/test_db";
        elif [ "${DATABASE_TYPE}" = "mysql" ]; then
          echo "mysql://root:root@mysql:3306/test_db";
        fi
      )
    REDIS_URL: "redis://redis:6379"
    CI: "true"

  dependencies:
    - install

  script:
    - npm run test

  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days

# Code Coverage
coverage:
  stage: test
  image: node:${NODE_VERSION}
  rules:
    - if: '${ENABLE_CODE_COVERAGE}' == 'true'
  dependencies:
    - install
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# Security Scanning
security:audit:
  stage: security
  image: node:${NODE_VERSION}
  rules:
    - if: '${ENABLE_SECURITY_SCAN}' == 'true'
  dependencies:
    - install
  script:
    - npm audit --audit-level=moderate
  allow_failure: true

security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: '${ENABLE_SECURITY_SCAN}' == 'true'
  script:
    - trivy fs --exit-code 0 --format json --output trivy-report.json .
    - trivy fs --exit-code 1 --severity CRITICAL .
  artifacts:
    reports:
      container_scanning: trivy-report.json
    expire_in: 7 days
  allow_failure: true

# Dependency Check
security:dependencies:
  stage: security
  image: node:${NODE_VERSION}
  rules:
    - if: '${ENABLE_DEPENDENCY_CHECK}' == 'true'
  dependencies:
    - install
  script:
    - npm outdated || true
  allow_failure: true

# SonarQube Analysis
sonarqube:
  stage: security
  image: sonarsource/sonar-scanner-cli:latest
  rules:
    - if: '${ENABLE_SONARQUBE}' == 'true'
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true

# Build Application
build:
  stage: build
  image: node:${NODE_VERSION}
  dependencies:
    - install
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# Docker Build and Push
docker:build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '${ENABLE_DOCKER}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - build
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY_URL
  script:
    - docker build -t $REGISTRY_URL/${SERVICE_NAME}:$CI_COMMIT_SHORT_SHA .
    - docker tag $REGISTRY_URL/${SERVICE_NAME}:$CI_COMMIT_SHORT_SHA $REGISTRY_URL/${SERVICE_NAME}:latest
    - docker push $REGISTRY_URL/${SERVICE_NAME}:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/${SERVICE_NAME}:latest
  after_script:
    - docker logout $REGISTRY_URL

# Deploy to Kubernetes
deploy:kubernetes:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && '${DEPLOYMENT_TARGET}' == 'kubernetes' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies: []
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > ${HOME}/.kube/config
  script:
    - kubectl set image deployment/${SERVICE_NAME}
        ${SERVICE_NAME}=$REGISTRY_URL/${SERVICE_NAME}:$CI_COMMIT_SHORT_SHA
        --namespace=${KUBERNETES_NAMESPACE}
    - kubectl rollout status deployment/${SERVICE_NAME}
        --namespace=${KUBERNETES_NAMESPACE}
        --timeout=5m
  environment:
    name: production
    url: https://${SERVICE_NAME}.example.com

# Deploy to Cloud Run
deploy:cloud-run:
  stage: deploy
  image: google/cloud-sdk:alpine
  rules:
    - if: '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && '${DEPLOYMENT_TARGET}' == 'cloud-run' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies: []
  before_script:
    - echo "$GCP_SA_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
  script:
    - gcloud run deploy ${SERVICE_NAME}
        --image=$REGISTRY_URL/${SERVICE_NAME}:$CI_COMMIT_SHORT_SHA
        --region=us-central1
        --platform=managed
  environment:
    name: production
    url: https://${SERVICE_NAME}.run.app

# Deploy to AWS ECS
deploy:ecs:
  stage: deploy
  image: amazon/aws-cli:latest
  rules:
    - if: '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && '${DEPLOYMENT_TARGET}' == 'ecs' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies: []
  script:
    - aws ecs update-service
        --cluster $ECS_CLUSTER
        --service ${SERVICE_NAME}
        --force-new-deployment
  environment:
    name: production

# Manual deployment trigger
deploy:manual:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '${ENABLE_AUTO_DEPLOYMENT}' == 'false'
      when: manual
  script:
    - echo "Manual deployment triggered. Configure your deployment here."
  environment:
    name: production
    action: prepare