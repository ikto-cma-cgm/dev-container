name: CI/CD Pipeline

on:
  push:
    branches: [ ${{ values.defaultBranch }} {% if values.defaultBranch != 'develop' %}, develop{% endif %} ]
  pull_request:
    branches: [ ${{ values.defaultBranch }} ]

env:
  NODE_VERSION: '${{ values.nodeVersion }}'
  SERVICE_NAME: '${{ values.serviceName }}'

jobs:
  # Lint and Test
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    {%- if values.requiresDatabase or values.requiresRedis %}
    services:
      {%- if values.requiresDatabase and values.databaseType == 'postgresql' %}
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      {%- elif values.requiresDatabase and values.databaseType == 'mongodb' %}
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      {%- elif values.requiresDatabase and values.databaseType == 'mysql' %}
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      {%- endif %}
      {%- if values.requiresRedis %}
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      {%- endif %}
    {%- endif %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: "{% raw %}${{ steps.check-lockfile.outputs.files_exists == 'true' && 'npm' || '' }}{% endraw %}"

      - name: Check for lockfile
        id: check-lockfile
        uses: andstor/file-existence-action@v2
        with:
          files: "package-lock.json"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      {%- if values.runLint %}

      - name: Run linter
        run: npm run lint
      {%- endif %}

      {%- if values.runTests %}

      - name: Run tests
        run: {% if values.enableCodeCoverage %}npm run test:coverage{% else %}npm run test{% endif %}
        env:
          CI: true
          {%- if values.requiresDatabase and values.databaseType == 'postgresql' %}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          {%- elif values.requiresDatabase and values.databaseType == 'mongodb' %}
          DATABASE_URL: mongodb://localhost:27017/test_db
          {%- elif values.requiresDatabase and values.databaseType == 'mysql' %}
          DATABASE_URL: mysql://root:root@localhost:3306/test_db
          {%- endif %}
          {%- if values.requiresRedis %}
          REDIS_URL: redis://localhost:6379
          {%- endif %}
      {%- endif %}

      {%- if values.enableCodeCoverage %}

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
          fail_ci_if_error: false
      {%- endif %}

      - name: Build application
        run: npm run build

  {%- if values.enableSecurityScan %}

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
  {%- endif %}

  {%- if values.enableDependencyCheck %}

  # Dependency Check
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: Check for deprecated dependencies
        run: npx check-dependencies || true
  {%- endif %}

  {%- if values.enableSonarQube %}

  # SonarQube Analysis
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
          SONAR_HOST_URL: {% raw %}${{ secrets.SONAR_HOST_URL }}{% endraw %}
  {%- endif %}

  {%- if values.enableWebDriverIO %}

  # E2E Tests with WebDriverIO
  e2e-tests:
    name: E2E Tests (WebDriverIO)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify WebDriverIO setup
        run: |
          if [ ! -d "webdriver-io" ]; then
            echo "::error::WebDriverIO directory not found. Please use the WebDriverIO template first."
            exit 1
          fi

      - name: Run E2E Tests
        working-directory: webdriver-io
        run: docker-compose up --build --abort-on-container-exit --exit-code-from wdio-tests
        env:
          BASE_URL: '${{ values.wdioBaseUrl }}'

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: webdriver-io/test-results/screenshots/
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results
          path: webdriver-io/allure-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: webdriver-io
        run: docker-compose down -v || true
  {%- endif %}

  {%- if values.enableJMeter %}

  # Load Tests with JMeter
  load-tests:
    name: Load Tests (JMeter)
    runs-on: ubuntu-latest
    needs: [test{% if values.enableWebDriverIO %}, e2e-tests{% endif %}]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify JMeter setup
        run: |
          if [ ! -d "jmeter" ]; then
            echo "::error::JMeter directory not found. Please use the JMeter template first."
            exit 1
          fi

      - name: Run Load Tests
        working-directory: jmeter
        run: docker-compose up --build --abort-on-container-exit --exit-code-from jmeter
        env:
          TARGET_HOST: '${{ values.jmeterTargetHost }}'
        continue-on-error: true

      - name: Upload JMeter Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: jmeter/reports/
          retention-days: 14

      - name: Cleanup
        if: always()
        working-directory: jmeter
        run: docker-compose down -v || true
  {%- endif %}

  {%- if values.enableDocker %}

  # Build and Push Docker Image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}
          username: {% raw %}${{ secrets.REGISTRY_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.REGISTRY_PASSWORD }}{% endraw %}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={% raw %}{{branch}}{% endraw %}-
            type=raw,value=latest,enable={% raw %}{{is_default_branch}}{% endraw %}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: {% raw %}${{ steps.meta.outputs.tags }}{% endraw %}
          labels: {% raw %}${{ steps.meta.outputs.labels }}{% endraw %}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  {%- endif %}

  {%- if values.deploymentTarget == 'kubernetes' and values.enableAutoDeployment %}

  # Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: {% if values.enableDocker %}docker{% else %}test{% endif %}
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: {% raw %}${{ secrets.KUBE_CONFIG }}{% endraw %}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/${{ values.serviceName }} \
            ${{ values.serviceName }}={% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}:{% raw %}${{ github.sha }}{% endraw %} \
            --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ values.serviceName }} \
            --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %} \
            --timeout=5m

  {%- elif values.deploymentTarget == 'cloud-run' and values.enableAutoDeployment %}

  # Deploy to Cloud Run
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: {% if values.enableDocker %}docker{% else %}test{% endif %}
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: {% raw %}${{ secrets.GCP_SA_KEY }}{% endraw %}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ values.serviceName }}
          image: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}:{% raw %}${{ github.sha }}{% endraw %}
          region: us-central1

  {%- elif values.deploymentTarget == 'ecs' and values.enableAutoDeployment %}

  # Deploy to AWS ECS
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: {% if values.enableDocker %}docker{% else %}test{% endif %}
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: {% raw %}${{ secrets.AWS_ACCESS_KEY_ID }}{% endraw %}
          aws-secret-access-key: {% raw %}${{ secrets.AWS_SECRET_ACCESS_KEY }}{% endraw %}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster {% raw %}${{ secrets.ECS_CLUSTER }}{% endraw %} \
            --service ${{ values.serviceName }} \
            --force-new-deployment

  {%- endif %}