image: maven:3-eclipse-temurin-${JAVA_VERSION}

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

stages:
  - build
  - test

build:
  stage: build
  script:
    - mvn clean package -DskipTests

test:
  stage: test
  rules:
    - if: $RUN_TESTS == "true"
  script:
    - mvn test
