variables:
  NODE_VERSION: '${NODE_VERSION}'
  APP_NAME: '${APP_NAME}'
  BUILD_COMMAND: '${BUILD_COMMAND}'

stages:
  - install
  - lint
  - test
  - build
  - security
  - lighthouse
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - .next/cache/

install:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 day

lint:
  stage: lint
  image: node:${NODE_VERSION}
  rules:
    - if: '${RUN_LINT}' == 'true'
  dependencies:
    - install
  script:
    - npm run lint

test:
  stage: test
  image: node:${NODE_VERSION}
  rules:
    - if: '${RUN_TESTS}' == 'true'
  dependencies:
    - install
  script:
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

e2e:
  stage: test
  image: mcr.microsoft.com/playwright:latest
  rules:
    - if: '${RUN_E2E_TESTS}' == 'true'
  dependencies:
    - install
  script:
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 7 days

build:
  stage: build
  image: node:${NODE_VERSION}
  dependencies:
    - install
  script:
    - ${BUILD_COMMAND}
  artifacts:
    paths:
      - .next/
      - out/
    expire_in: 7 days

lighthouse:
  stage: lighthouse
  image: node:${NODE_VERSION}-slim
  rules:
    - if: '${ENABLE_LIGHTHOUSE}' == 'true' && $CI_PIPELINE_SOURCE == "merge_request_event"
  dependencies:
    - build
  script:
    - npm install -g @lhci/cli
    - lhci autorun
  artifacts:
    reports:
      browser_performance: lighthouse-report.json
  allow_failure: true

security:scan:
  stage: security
  image: node:${NODE_VERSION}
  rules:
    - if: '${ENABLE_SECURITY_SCAN}' == 'true'
  dependencies:
    - install
  script:
    - npm audit --audit-level=moderate
  allow_failure: true

docker:build:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '${ENABLE_DOCKER}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - build
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY_URL
  script:
    - docker build -t $REGISTRY_URL/${APP_NAME}:$CI_COMMIT_SHORT_SHA .
    - docker tag $REGISTRY_URL/${APP_NAME}:$CI_COMMIT_SHORT_SHA $REGISTRY_URL/${APP_NAME}:latest
    - docker push $REGISTRY_URL/${APP_NAME}:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/${APP_NAME}:latest

deploy:vercel:
  stage: deploy
  image: node:${NODE_VERSION}
  rules:
    - if: '${DEPLOYMENT_TARGET}' == 'vercel' && '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - build
  script:
    - npm install -g vercel
    - vercel --prod --token=$VERCEL_TOKEN
  environment:
    name: production
    url: https://${APP_NAME}.vercel.app

deploy:netlify:
  stage: deploy
  image: node:${NODE_VERSION}
  rules:
    - if: '${DEPLOYMENT_TARGET}' == 'netlify' && '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - build
  script:
    - npm install -g netlify-cli
    - netlify deploy --prod --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
  environment:
    name: production

deploy:kubernetes:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: '${DEPLOYMENT_TARGET}' == 'kubernetes' && '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies: []
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > ${HOME}/.kube/config
  script:
    - kubectl set image deployment/${APP_NAME}
        ${APP_NAME}=$REGISTRY_URL/${APP_NAME}:$CI_COMMIT_SHORT_SHA
        --namespace=${KUBERNETES_NAMESPACE}
  environment:
    name: production

pages:
  stage: deploy
  rules:
    - if: '${DEPLOYMENT_TARGET}' == 'gitlab-pages' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - build
  script:
    - mv out public || mv .next/standalone public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}