apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.projectName }}
  title: ${{ values.projectName }}
  description: ${{ values.description }}
  tags:
    - notification
    - integration
    - chatbot
  annotations:
    github.com/project-slug: {% raw %}${{ values.repoUrl | projectSlug }}{% endraw %}
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  system: notifications
  dependsOn:
    - component:chatbot