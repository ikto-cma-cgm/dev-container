apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: notification-service-template
  title: 🔔 Notification Service
  description: Créez un service qui envoie des notifications au Chatbot - Parfait pour les démos et les intégrations
  tags:
    - integration
    - notification
    - demo
    - chatbot
    - recommended
spec:
  owner: integration-team
  type: integration-service

  parameters:
    - title: 🎯 Configuration du Service
      description: Informations de base pour votre service de notification
      required:
        - projectName
        - repoUrl
      properties:
        projectName:
          title: Nom du Projet
          type: string
          description: "Nom de votre service (ex: build-notifier, deploy-alerts)"
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
          ui:placeholder: 'mon-service-notification'
          ui:help: 'Utilisez des minuscules et des tirets'

        description:
          title: Description
          type: string
          description: Brève description de votre service
          default: 'Service de notification pour le Chatbot'
          ui:placeholder: 'Notifie les événements de build au chatbot'

        repoUrl:
          title: Repository GitHub
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: 🔔 Configuration de la Notification
      description: Personnalisez le message de notification par défaut
      properties:
        notificationTitle:
          title: Titre de la Notification
          type: string
          description: Titre qui apparaîtra dans le chatbot
          default: 'Nouveau service créé'
          ui:placeholder: 'Build réussi'
          ui:help: 'Clair et concis'

        notificationMessage:
          title: Message de la Notification
          type: string
          description: Message détaillé
          default: 'Le service de notification a été déployé avec succès'
          ui:widget: textarea
          ui:options:
            rows: 3
          ui:placeholder: 'Le build de la branche main a été déployé en production'

        notificationType:
          title: Type de Notification
          type: string
          description: Type visuel de la notification
          default: success
          enum:
            - info
            - success
            - warning
            - error
          enumNames:
            - 'ℹ️ Info'
            - '✅ Success'
            - '⚠️ Warning'
            - '❌ Error'

    - title: ⚙️ Options Avancées
      description: Configuration optionnelle du service
      properties:
        chatbotUrl:
          title: URL du Chatbot
          type: string
          description: URL de l'API du chatbot
          default: 'http://localhost:8081'
          ui:placeholder: 'http://chatbot-api.example.com:8081'
          ui:help: "Par défaut: localhost:8081"

        includeDocker:
          title: Inclure Docker
          type: boolean
          description: Générer les fichiers Docker et docker-compose
          default: true

        includeTests:
          title: Inclure les Tests
          type: boolean
          description: Générer les tests unitaires
          default: true

  steps:
    - id: fetch-template
      name: Générer le Service
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
        values:
          projectName: ${{ parameters.projectName }}
          description: ${{ parameters.description }}
          notificationTitle: ${{ parameters.notificationTitle }}
          notificationMessage: ${{ parameters.notificationMessage }}
          notificationType: ${{ parameters.notificationType }}
          chatbotUrl: ${{ parameters.chatbotUrl }}
          includeDocker: ${{ parameters.includeDocker }}
          includeTests: ${{ parameters.includeTests }}
          owner: ${{ user.entity.metadata.name }}

    - id: publish
      name: Créer le Repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        description: ${{ parameters.description }}
        repoVisibility: public

    - id: register
      name: Enregistrer dans le Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: 🎉 Ouvrir le Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 📦 Voir dans le Catalog
        icon: catalog
        url: /catalog/default/component/${{ parameters.projectName }}
      - title: 🔔 Tester la Notification
        icon: code
        url: ${{ steps.publish.output.remoteUrl }}/blob/main/README.md#-quick-start
    text:
      - title: ✅ Service de Notification Créé!
        content: |
          Votre service de notification **${{ parameters.projectName }}** est prêt! 🎉

          ## 🚀 Prochaines Étapes

          **1. Cloner le repository**
          ```bash
          git clone ${{ steps.publish.output.remoteUrl }}
          cd ${{ parameters.projectName }}
          ```

          **2. Installer les dépendances**
          ```bash
          npm install
          ```

          **3. Tester localement**{% if parameters.includeDocker %}
          ```bash
          # Avec Docker
          docker-compose up

          # Ou sans Docker
          npm start
          ```{% else %}
          ```bash
          npm start
          ```{% endif %}

          **4. Personnaliser**
          - Éditez `src/index.js` pour modifier la logique
          - Changez le titre et le message de notification
          - Ajoutez des métadonnées personnalisées

          ## 📊 Votre Configuration

          - **Titre**: {{ parameters.notificationTitle }}
          - **Message**: {{ parameters.notificationMessage }}
          - **Type**: {{ parameters.notificationType }}
          - **Chatbot**: {{ parameters.chatbotUrl }}

          ## 🔔 Comment ça marche?

          Ce service envoie un POST vers `{{ parameters.chatbotUrl }}/api/notifications` avec:
          ```json
          {
            "title": "Votre titre",
            "message": "Votre message",
            "type": "{{ parameters.notificationType }}",
            "metadata": {}
          }
          ```

          La notification apparaîtra dans le chatbot avec une cloche et un badge!

          ## 💡 Use Cases

          - Notifier les builds réussis/échoués
          - Alerter sur les déploiements
          - Signaler les erreurs critiques
          - Informer des nouveaux services créés
          - Intégrer avec CI/CD (GitHub Actions, GitLab CI)

          ## 🆘 Besoin d'Aide?

          - 📖 Consultez le README dans le repository
          - 💬 Demandez au chatbot: "Comment utiliser mon service de notification?"
          - 📧 Contactez l'équipe plateforme

          Bon développement! 🚀