# GitLab CI/CD Pipeline
# Generated by Pipeline Composer Template

stages:
  - build
  - test
  - security
  - quality
  {%- if values.enableWebDriverIO %}
  - e2e
  {%- endif %}
  {%- if values.enableJMeter %}
  - performance
  {%- endif %}
  {%- if values.enableDocker %}
  - docker
  {%- endif %}
  {%- if values.deploymentTarget != 'none' %}
  - deploy
  {%- endif %}

variables:
  {%- if values.projectType in ['nodejs', 'react', 'fullstack'] %}
  NODE_VERSION: "${{ values.nodeVersion }}"
  {%- endif %}
  {%- if values.projectType == 'java' %}
  JAVA_VERSION: "${{ values.javaVersion }}"
  {%- endif %}
  PROJECT_NAME: "${{ values.projectName }}"

# ============================================
# STAGE 1: Build & Unit Tests
# ============================================
{%- if values.enableBuild or values.enableUnitTests or values.enableLinting %}

{%- if values.projectType in ['nodejs', 'react', 'fullstack'] %}
build-and-test:
  stage: build
  image: node:${NODE_VERSION}-slim
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    {%- if values.enableLinting %}
    - npm run lint
    {%- endif %}
    {%- if values.enableUnitTests %}
    - npm run test:coverage
    {%- endif %}
    {%- if values.enableBuild %}
    - npm run build
    {%- endif %}
  artifacts:
    paths:
      - dist/
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
{%- elif values.projectType == 'java' %}
build-and-test:
  stage: build
  image: maven:3.9-eclipse-temurin-${JAVA_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    {%- if values.enableLinting %}
    - mvn checkstyle:check
    {%- endif %}
    {%- if values.enableUnitTests %}
    - mvn test
    {%- endif %}
    {%- if values.enableBuild %}
    - mvn package -DskipTests
    {%- endif %}
  artifacts:
    paths:
      - target/*.jar
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
{%- endif %}
{%- endif %}

# ============================================
# STAGE 2: Security Scanning
# ============================================
{%- if values.enableSecurityScan %}

security-scan:
  stage: security
  needs: [build-and-test]
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --format json -o trivy-results.json .
  artifacts:
    paths:
      - trivy-results.json
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
{%- endif %}

# ============================================
# STAGE 3: SonarQube Analysis
# ============================================
{%- if values.enableSonarQube %}

sonarqube:
  stage: quality
  needs: [build-and-test]
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=${PROJECT_NAME}
      -Dsonar.sources=.
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
{%- endif %}

# ============================================
# STAGE 4: E2E Tests (WebDriverIO)
# ============================================
{%- if values.enableWebDriverIO %}

e2e-tests:
  stage: e2e
  needs: [build-and-test]
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    WDIO_BASE_URL: "${{ values.wdioBaseUrl }}"
  before_script:
    - |
      if [ ! -d "webdriver-io" ]; then
        echo "ERROR: webdriver-io/ directory not found"
        exit 1
      fi
  script:
    - cd webdriver-io
    - docker-compose up --build --abort-on-container-exit --exit-code-from wdio-tests
  after_script:
    - cd webdriver-io && docker-compose down -v || true
  artifacts:
    when: always
    paths:
      - webdriver-io/test-results/
      - webdriver-io/allure-results/
    reports:
      junit: webdriver-io/test-results/*.xml
    expire_in: 7 days
  rules:
    {%- if values.wdioRunOnPR %}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    {%- endif %}
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
{%- endif %}

# ============================================
# STAGE 5: Load Tests (JMeter)
# ============================================
{%- if values.enableJMeter %}

load-tests:
  stage: performance
  needs:
    - build-and-test
    {%- if values.enableWebDriverIO %}
    - e2e-tests
    {%- endif %}
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TARGET_HOST: "${{ values.jmeterTargetHost }}"
    TARGET_PORT: "${{ values.jmeterTargetPort }}"
    THREADS: "${{ values.jmeterThreads }}"
    DURATION: "${{ values.jmeterDuration }}"
  before_script:
    - |
      if [ ! -d "jmeter" ]; then
        echo "ERROR: jmeter/ directory not found"
        exit 1
      fi
  script:
    - cd jmeter
    - docker-compose up --build --abort-on-container-exit --exit-code-from jmeter || true
  after_script:
    - cd jmeter && docker-compose down -v || true
  artifacts:
    when: always
    paths:
      - jmeter/reports/
      - jmeter/results/
    expire_in: 14 days
  rules:
    {%- if values.jmeterRunOnPR %}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    {%- endif %}
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
{%- endif %}

# ============================================
# STAGE 6: Docker Build
# ============================================
{%- if values.enableDocker %}

docker-build:
  stage: docker
  needs:
    - build-and-test
    {%- if values.enableSecurityScan %}
    - security-scan
    {%- endif %}
    {%- if values.enableSonarQube %}
    - sonarqube
    {%- endif %}
    {%- if values.enableWebDriverIO %}
    - e2e-tests
    {%- endif %}
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $REGISTRY_USERNAME -p $REGISTRY_PASSWORD $REGISTRY_URL
    - docker build -t $REGISTRY_URL/${PROJECT_NAME}:${CI_COMMIT_SHA} .
    - docker tag $REGISTRY_URL/${PROJECT_NAME}:${CI_COMMIT_SHA} $REGISTRY_URL/${PROJECT_NAME}:latest
    - docker push $REGISTRY_URL/${PROJECT_NAME}:${CI_COMMIT_SHA}
    - docker push $REGISTRY_URL/${PROJECT_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
{%- endif %}

# ============================================
# STAGE 7: Deployment
# ============================================
{%- if values.deploymentTarget == 'kubernetes' %}

deploy:
  stage: deploy
  needs: [docker-build]
  image: bitnami/kubectl:latest
  script:
    - kubectl config set-cluster k8s --server="${K8S_API_SERVER}" --certificate-authority="${K8S_CA_CERT}"
    - kubectl config set-credentials gitlab --token="${K8S_TOKEN}"
    - kubectl config set-context default --cluster=k8s --user=gitlab --namespace=${K8S_NAMESPACE}
    - kubectl config use-context default
    - kubectl set image deployment/${PROJECT_NAME} ${PROJECT_NAME}=$REGISTRY_URL/${PROJECT_NAME}:${CI_COMMIT_SHA} --namespace=${K8S_NAMESPACE}
    - kubectl rollout status deployment/${PROJECT_NAME} --namespace=${K8S_NAMESPACE} --timeout=5m
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
{%- elif values.deploymentTarget == 'cloud-run' %}

deploy:
  stage: deploy
  needs: [docker-build]
  image: google/cloud-sdk:latest
  script:
    - echo $GCP_SA_KEY | base64 -d > /tmp/sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/sa-key.json
    - gcloud run deploy ${PROJECT_NAME} --image=$REGISTRY_URL/${PROJECT_NAME}:${CI_COMMIT_SHA} --region=us-central1 --platform=managed
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
{%- elif values.deploymentTarget == 'aws-ecs' %}

deploy:
  stage: deploy
  needs: [docker-build]
  image: amazon/aws-cli:latest
  script:
    - aws ecs update-service --cluster $ECS_CLUSTER --service ${PROJECT_NAME} --force-new-deployment
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
{%- endif %}
