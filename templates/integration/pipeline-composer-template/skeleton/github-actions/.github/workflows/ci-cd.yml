name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  {%- if values.projectType in ['nodejs', 'react', 'fullstack'] %}
  NODE_VERSION: '${{ values.nodeVersion }}'
  {%- endif %}
  {%- if values.projectType == 'java' %}
  JAVA_VERSION: '${{ values.javaVersion }}'
  {%- endif %}
  PROJECT_NAME: '${{ values.projectName }}'

jobs:
  # ============================================
  # STAGE 1: Build & Unit Tests
  # ============================================
  {%- if values.enableBuild or values.enableUnitTests or values.enableLinting %}
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      {%- if values.projectType in ['nodejs', 'react', 'fullstack'] %}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      {%- endif %}

      {%- if values.projectType == 'java' %}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: {% raw %}${{ env.JAVA_VERSION }}{% endraw %}
          distribution: 'temurin'
          cache: 'maven'
      {%- endif %}

      {%- if values.enableLinting %}
      - name: Run linter
        run: {% if values.projectType == 'java' %}mvn checkstyle:check{% else %}npm run lint{% endif %}
      {%- endif %}

      {%- if values.enableUnitTests %}
      - name: Run unit tests
        run: {% if values.projectType == 'java' %}mvn test{% else %}npm run test:coverage{% endif %}
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
          fail_ci_if_error: false
      {%- endif %}

      {%- if values.enableBuild %}
      - name: Build application
        run: {% if values.projectType == 'java' %}mvn package -DskipTests{% else %}npm run build{% endif %}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: {% if values.projectType == 'java' %}target/*.jar{% else %}dist/{% endif %}
          retention-days: 7
      {%- endif %}
  {%- endif %}

  # ============================================
  # STAGE 2: Security Scanning
  # ============================================
  {%- if values.enableSecurityScan %}
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    {%- if values.enableBuild or values.enableUnitTests %}
    needs: build-and-test
    {%- endif %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      {%- if values.projectType in ['nodejs', 'react', 'fullstack'] %}
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      {%- endif %}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
  {%- endif %}

  # ============================================
  # STAGE 3: SonarQube Analysis
  # ============================================
  {%- if values.enableSonarQube %}
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
          SONAR_HOST_URL: {% raw %}${{ secrets.SONAR_HOST_URL }}{% endraw %}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
  {%- endif %}

  # ============================================
  # STAGE 4: E2E Tests (WebDriverIO)
  # ============================================
  {%- if values.enableWebDriverIO %}
  e2e-tests:
    name: E2E Tests (WebDriverIO)
    runs-on: ubuntu-latest
    needs: build-and-test
    {%- if not values.wdioRunOnPR %}
    if: github.event_name == 'push'
    {%- endif %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify WebDriverIO setup
        run: |
          if [ ! -d "webdriver-io" ]; then
            echo "::error::WebDriverIO directory not found. Please use the WebDriverIO template first."
            exit 1
          fi

      {%- if values.wdioExecutionMode == 'docker' %}
      - name: Run E2E Tests (Docker)
        working-directory: webdriver-io
        run: |
          docker-compose up --build --abort-on-container-exit --exit-code-from wdio-tests
        env:
          BASE_URL: '${{ values.wdioBaseUrl }}'
        continue-on-error: false

      - name: Cleanup Docker
        if: always()
        working-directory: webdriver-io
        run: docker-compose down -v || true
      {%- elif values.wdioExecutionMode == 'local' %}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: webdriver-io/package-lock.json

      - name: Install dependencies
        working-directory: webdriver-io
        run: npm ci

      - name: Run E2E Tests (Local)
        working-directory: webdriver-io
        run: npm run test:e2e
        env:
          BASE_URL: '${{ values.wdioBaseUrl }}'
          HEADLESS: 'true'
      {%- elif values.wdioExecutionMode == 'cloud' %}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: webdriver-io/package-lock.json

      - name: Install dependencies
        working-directory: webdriver-io
        run: npm ci

      - name: Run E2E Tests (BrowserStack)
        working-directory: webdriver-io
        run: npm run test:e2e:cloud
        env:
          BASE_URL: '${{ values.wdioBaseUrl }}'
          BROWSERSTACK_USERNAME: {% raw %}${{ secrets.BROWSERSTACK_USERNAME }}{% endraw %}
          BROWSERSTACK_ACCESS_KEY: {% raw %}${{ secrets.BROWSERSTACK_ACCESS_KEY }}{% endraw %}
      {%- endif %}

      - name: Upload E2E Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: webdriver-io/test-results/screenshots/
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results
          path: webdriver-io/allure-results/
          retention-days: 7
  {%- endif %}

  # ============================================
  # STAGE 5: Load Tests (JMeter)
  # ============================================
  {%- if values.enableJMeter %}
  load-tests:
    name: Load Tests (JMeter)
    runs-on: ubuntu-latest
    needs: [build-and-test{% if values.enableWebDriverIO %}, e2e-tests{% endif %}]
    {%- if not values.jmeterRunOnPR %}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    {%- endif %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify JMeter setup
        run: |
          if [ ! -d "jmeter" ]; then
            echo "::error::JMeter directory not found. Please use the JMeter template first."
            exit 1
          fi

      - name: Run Load Tests
        working-directory: jmeter
        run: |
          docker-compose up --build --abort-on-container-exit --exit-code-from jmeter
        env:
          TARGET_HOST: '${{ values.jmeterTargetHost }}'
          TARGET_PORT: '${{ values.jmeterTargetPort }}'
          THREADS: '${{ values.jmeterThreads }}'
          DURATION: '${{ values.jmeterDuration }}'
        continue-on-error: true

      - name: Upload JMeter Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: jmeter/reports/
          retention-days: 14

      - name: Cleanup Docker
        if: always()
        working-directory: jmeter
        run: docker-compose down -v || true
  {%- endif %}

  # ============================================
  # STAGE 6: Docker Build
  # ============================================
  {%- if values.enableDocker %}
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      {%- if values.enableSecurityScan %}
      - security-scan
      {%- endif %}
      {%- if values.enableSonarQube %}
      - sonarqube
      {%- endif %}
      {%- if values.enableWebDriverIO %}
      - e2e-tests
      {%- endif %}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}
          username: {% raw %}${{ secrets.REGISTRY_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.REGISTRY_PASSWORD }}{% endraw %}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.projectName }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={% raw %}{{is_default_branch}}{% endraw %}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: {% raw %}${{ steps.meta.outputs.tags }}{% endraw %}
          labels: {% raw %}${{ steps.meta.outputs.labels }}{% endraw %}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  {%- endif %}

  # ============================================
  # STAGE 7: Deployment
  # ============================================
  {%- if values.deploymentTarget == 'kubernetes' %}
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: {% raw %}${{ secrets.KUBE_CONFIG }}{% endraw %}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/${{ values.projectName }} \
            ${{ values.projectName }}={% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.projectName }}:{% raw %}${{ github.sha }}{% endraw %} \
            --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ values.projectName }} \
            --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %} \
            --timeout=5m

  {%- elif values.deploymentTarget == 'cloud-run' %}
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: {% raw %}${{ secrets.GCP_SA_KEY }}{% endraw %}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ values.projectName }}
          image: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.projectName }}:{% raw %}${{ github.sha }}{% endraw %}
          region: us-central1

  {%- elif values.deploymentTarget == 'aws-ecs' %}
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: {% raw %}${{ secrets.AWS_ACCESS_KEY_ID }}{% endraw %}
          aws-secret-access-key: {% raw %}${{ secrets.AWS_SECRET_ACCESS_KEY }}{% endraw %}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster {% raw %}${{ secrets.ECS_CLUSTER }}{% endraw %} \
            --service ${{ values.projectName }} \
            --force-new-deployment

  {%- elif values.deploymentTarget == 'vercel' %}
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: {% raw %}${{ secrets.VERCEL_TOKEN }}{% endraw %}
          vercel-org-id: {% raw %}${{ secrets.VERCEL_ORG_ID }}{% endraw %}
          vercel-project-id: {% raw %}${{ secrets.VERCEL_PROJECT_ID }}{% endraw %}
          vercel-args: '--prod'
  {%- endif %}
