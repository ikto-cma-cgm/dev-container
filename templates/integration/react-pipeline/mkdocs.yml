site_name: React/Next.js CI/CD Pipeline
site_description: Documentation for the React/Next.js CI/CD pipeline templates used in the CMA-CGM Developer Platform
site_author: Platform Team

repo_url: https://github.com/ikto-cma-cgm/react-pipeline-template
repo_name: ikto-cma-cgm/react-pipeline-template

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
  - techdocs-core
