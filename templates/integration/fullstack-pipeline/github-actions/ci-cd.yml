name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ ${{ values.defaultBranch }} {% if values.defaultBranch != 'develop' %}, develop{% endif %} ]
  pull_request:
    branches: [ ${{ values.defaultBranch }} ]

env:
  NODE_VERSION: '${{ values.nodeVersion }}'
  SERVICE_NAME: '${{ values.serviceName }}'

jobs:
  # Frontend CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      {%- if values.runLint %}

      - name: Run linter
        run: npm run lint
      {%- endif %}

      {%- if values.runTests %}

      - name: Run tests
        run: npm run test
        env:
          CI: true
      {%- endif %}

      - name: Build frontend
        run: npm run build
        env:
          CI: true

  # Backend CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    {%- if values.requiresDatabase or values.requiresRedis %}
    services:
      {%- if values.requiresDatabase and values.databaseType == 'postgresql' %}
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      {%- elif values.requiresDatabase and values.databaseType == 'mongodb' %}
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      {%- elif values.requiresDatabase and values.databaseType == 'mysql' %}
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      {%- endif %}
      {%- if values.requiresRedis %}
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      {%- endif %}
    {%- endif %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      {%- if values.runLint %}

      - name: Run linter
        run: npm run lint
      {%- endif %}

      {%- if values.runTests %}

      - name: Run tests
        run: npm run test
        env:
          CI: true
          {%- if values.requiresDatabase and values.databaseType == 'postgresql' %}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          {%- elif values.requiresDatabase and values.databaseType == 'mongodb' %}
          DATABASE_URL: mongodb://localhost:27017/test_db
          {%- elif values.requiresDatabase and values.databaseType == 'mysql' %}
          DATABASE_URL: mysql://root:root@localhost:3306/test_db
          {%- endif %}
          {%- if values.requiresRedis %}
          REDIS_URL: redis://localhost:6379
          {%- endif %}
      {%- endif %}

      - name: Build backend
        run: npm run build

  {%- if values.runE2ETests %}

  # End-to-End Tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: ./frontend

      - name: Start services with docker-compose
        run: docker-compose up -d

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 2; done'

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./frontend

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker-compose down
  {%- endif %}

  {%- if values.enableLighthouse %}

  # Lighthouse Performance Audit
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: {% raw %}${{ env.NODE_VERSION }}{% endraw %}

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services
        run: sleep 30

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true

      - name: Stop services
        if: always()
        run: docker-compose down
  {%- endif %}

  {%- if values.enableSecurityScan %}

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run frontend security audit
        run: npm audit --audit-level=moderate
        working-directory: ./frontend
        continue-on-error: true

      - name: Run backend security audit
        run: npm audit --audit-level=moderate
        working-directory: ./backend
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
  {%- endif %}

  {%- if values.enableDocker %}

  # Build Docker Images
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}
          username: {% raw %}${{ secrets.REGISTRY_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.REGISTRY_PASSWORD }}{% endraw %}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-frontend:{% raw %}${{ github.sha }}{% endraw %}
            {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-backend:{% raw %}${{ github.sha }}{% endraw %}
            {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  {%- endif %}

  {%- if values.deploymentTarget == 'kubernetes' and values.enableAutoDeployment %}

  # Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: {% if values.enableDocker %}docker-build{% else %}[frontend-ci, backend-ci]{% endif %}
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: {% raw %}${{ secrets.KUBE_CONFIG }}{% endraw %}

      - name: Deploy Frontend
        run: |
          kubectl set image deployment/${{ values.serviceName }}-frontend \
            ${{ values.serviceName }}-frontend={% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-frontend:{% raw %}${{ github.sha }}{% endraw %} \
            --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %}

      - name: Deploy Backend
        run: |
          kubectl set image deployment/${{ values.serviceName }}-backend \
            ${{ values.serviceName }}-backend={% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-backend:{% raw %}${{ github.sha }}{% endraw %} \
            --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %}

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/${{ values.serviceName }}-frontend --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %} --timeout=5m
          kubectl rollout status deployment/${{ values.serviceName }}-backend --namespace={% raw %}${{ secrets.K8S_NAMESPACE }}{% endraw %} --timeout=5m

  {%- elif values.deploymentTarget == 'cloud-run' and values.enableAutoDeployment %}

  # Deploy to Cloud Run
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: {% if values.enableDocker %}docker-build{% else %}[frontend-ci, backend-ci]{% endif %}
    if: github.event_name == 'push' && github.ref == 'refs/heads/${{ values.defaultBranch }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: {% raw %}${{ secrets.GCP_SA_KEY }}{% endraw %}

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ values.serviceName }}-frontend
          image: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-frontend:{% raw %}${{ github.sha }}{% endraw %}
          region: us-central1

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ values.serviceName }}-backend
          image: {% raw %}${{ secrets.REGISTRY_URL }}{% endraw %}/${{ values.serviceName }}-backend:{% raw %}${{ github.sha }}{% endraw %}
          region: us-central1

  {%- endif %}