variables:
  NODE_VERSION: '${NODE_VERSION}'
  SERVICE_NAME: '${SERVICE_NAME}'

stages:
  - install
  - lint
  - test
  - build
  - e2e
  - docker
  - deploy

# Frontend Jobs
frontend:install:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
  artifacts:
    paths:
      - frontend/node_modules/
    expire_in: 1 day
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - frontend/.next/cache/

frontend:lint:
  stage: lint
  image: node:${NODE_VERSION}
  rules:
    - if: '${RUN_LINT}' == 'true'
  dependencies:
    - frontend:install
  script:
    - cd frontend
    - npm run lint

frontend:test:
  stage: test
  image: node:${NODE_VERSION}
  rules:
    - if: '${RUN_TESTS}' == 'true'
  dependencies:
    - frontend:install
  script:
    - cd frontend
    - npm run test

frontend:build:
  stage: build
  image: node:${NODE_VERSION}
  dependencies:
    - frontend:install
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
      - frontend/out/
    expire_in: 7 days

# Backend Jobs
backend:install:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - cd backend
    - npm ci --cache ../.npm --prefer-offline
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 day
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

backend:lint:
  stage: lint
  image: node:${NODE_VERSION}
  rules:
    - if: '${RUN_LINT}' == 'true'
  dependencies:
    - backend:install
  script:
    - cd backend
    - npm run lint

backend:test:
  stage: test
  image: node:${NODE_VERSION}
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: test_db
      rules:
        - if: '${REQUIRES_DATABASE}' == 'true' && '${DATABASE_TYPE}' == 'postgresql'
    - name: redis:7-alpine
      alias: redis
      rules:
        - if: '${REQUIRES_REDIS}' == 'true'
  rules:
    - if: '${RUN_TESTS}' == 'true'
  dependencies:
    - backend:install
  script:
    - cd backend
    - npm run test
  variables:
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/test_db"
    REDIS_URL: "redis://redis:6379"

backend:build:
  stage: build
  image: node:${NODE_VERSION}
  dependencies:
    - backend:install
  script:
    - cd backend
    - npm run build
  artifacts:
    paths:
      - backend/dist/
    expire_in: 7 days

# E2E Tests
e2e:
  stage: e2e
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '${RUN_E2E_TESTS}' == 'true'
  dependencies:
    - frontend:build
    - backend:build
  script:
    - docker-compose up -d
    - sleep 30
    - docker exec frontend npx playwright install --with-deps
    - docker exec frontend npm run test:e2e
  after_script:
    - docker-compose down
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
    expire_in: 7 days

# Lighthouse
lighthouse:
  stage: e2e
  image: node:${NODE_VERSION}-slim
  rules:
    - if: '${ENABLE_LIGHTHOUSE}' == 'true' && $CI_PIPELINE_SOURCE == "merge_request_event"
  dependencies:
    - frontend:build
    - backend:build
  script:
    - docker-compose up -d
    - sleep 30
    - npm install -g @lhci/cli
    - lhci autorun --collect.url=http://localhost:3000
    - docker-compose down
  artifacts:
    reports:
      browser_performance: lighthouse-report.json
  allow_failure: true

# Docker Build
docker:frontend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '${ENABLE_DOCKER}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - frontend:build
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY_URL
  script:
    - cd frontend
    - docker build -t $REGISTRY_URL/${SERVICE_NAME}-frontend:$CI_COMMIT_SHORT_SHA .
    - docker tag $REGISTRY_URL/${SERVICE_NAME}-frontend:$CI_COMMIT_SHORT_SHA $REGISTRY_URL/${SERVICE_NAME}-frontend:latest
    - docker push $REGISTRY_URL/${SERVICE_NAME}-frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/${SERVICE_NAME}-frontend:latest

docker:backend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '${ENABLE_DOCKER}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies:
    - backend:build
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY_URL
  script:
    - cd backend
    - docker build -t $REGISTRY_URL/${SERVICE_NAME}-backend:$CI_COMMIT_SHORT_SHA .
    - docker tag $REGISTRY_URL/${SERVICE_NAME}-backend:$CI_COMMIT_SHORT_SHA $REGISTRY_URL/${SERVICE_NAME}-backend:latest
    - docker push $REGISTRY_URL/${SERVICE_NAME}-backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/${SERVICE_NAME}-backend:latest

# Deploy
deploy:kubernetes:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: '${DEPLOYMENT_TARGET}' == 'kubernetes' && '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies: []
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > ${HOME}/.kube/config
  script:
    - kubectl set image deployment/${SERVICE_NAME}-frontend
        ${SERVICE_NAME}-frontend=$REGISTRY_URL/${SERVICE_NAME}-frontend:$CI_COMMIT_SHORT_SHA
        --namespace=${KUBERNETES_NAMESPACE}
    - kubectl set image deployment/${SERVICE_NAME}-backend
        ${SERVICE_NAME}-backend=$REGISTRY_URL/${SERVICE_NAME}-backend:$CI_COMMIT_SHORT_SHA
        --namespace=${KUBERNETES_NAMESPACE}
    - kubectl rollout status deployment/${SERVICE_NAME}-frontend --namespace=${KUBERNETES_NAMESPACE}
    - kubectl rollout status deployment/${SERVICE_NAME}-backend --namespace=${KUBERNETES_NAMESPACE}
  environment:
    name: production

deploy:cloud-run:
  stage: deploy
  image: google/cloud-sdk:alpine
  rules:
    - if: '${DEPLOYMENT_TARGET}' == 'cloud-run' && '${ENABLE_AUTO_DEPLOYMENT}' == 'true' && $CI_COMMIT_BRANCH == "${DEFAULT_BRANCH}"
  dependencies: []
  before_script:
    - echo "$GCP_SA_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
  script:
    - gcloud run deploy ${SERVICE_NAME}-frontend
        --image=$REGISTRY_URL/${SERVICE_NAME}-frontend:$CI_COMMIT_SHORT_SHA
        --region=us-central1
    - gcloud run deploy ${SERVICE_NAME}-backend
        --image=$REGISTRY_URL/${SERVICE_NAME}-backend:$CI_COMMIT_SHORT_SHA
        --region=us-central1
  environment:
    name: production