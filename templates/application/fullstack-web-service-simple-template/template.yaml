apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-website-one-click
  title: "🏆 Create a Website (One Click)"
  description: |
    **Golden Path** - Production-ready full-stack website with best practices built-in.
    Just provide a name and deploy in seconds.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - golden-path
    - recommended
    - one-click
    - fullstack
    - react
    - nodejs
    - typescript
spec:
  owner: platform-team
  type: website

  parameters:
    - title: Create Your Full-Stack Project
      description: |
        **One-Click Setup** - We'll create a production-ready full-stack application with:
        - React/Next.js frontend (port 3000)
        - Node.js/Express backend (port 3001)
        - PostgreSQL database
        - GitHub Actions CI/CD
        - Docker support
        - SonarQube quality scanning
        - WebdriverIO E2E testing
      required:
        - name
        - description
        - owner
        - repoUrl
      properties:
        name:
          title: Project Name
          type: string
          description: Unique name for your project (lowercase, hyphens allowed)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
          ui:help: 'Example: customer-portal, inventory-app'

        description:
          title: Description
          type: string
          description: A brief description of what this project does
          maxLength: 200

        owner:
          title: Owner
          type: string
          description: Team or user who owns this project
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              - kind: Group
              - kind: User

        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - ikto-cma-cgm
          description: GitHub repository for the monorepo

  steps:
    # 1. Fetch root monorepo structure
    - id: fetch-monorepo-root
      name: Create Monorepo Root Structure
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          configurationMode: simple
          frontendPort: 3000
          backendPort: 3001
          nodeVersion: '20.x'
          includeDatabase: true
          includeRedis: false
          includePWA: false
          enableCICD: true
          enableDocker: true
          repoUrl: ${{ parameters.repoUrl }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    # 2. Fetch React frontend template into apps/frontend
    - id: fetch-frontend
      name: Add React Frontend
      action: fetch:template
      input:
        url: https://github.com/ikto-cma-cgm/backstage/tree/main/templates/application/react-service-template/skeleton
        targetPath: ./apps/frontend
        copyWithoutTemplating:
          - '**/*.png'
          - '**/*.jpg'
          - '**/*.jpeg'
          - '**/*.gif'
          - '**/*.svg'
          - '**/*.ico'
        values:
          name: ${{ parameters.name }}-frontend
          description: Frontend for ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: 3000
          nodeVersion: '20.x'
          includePWA: false
          includeI18n: false
          enableCICD: false
          enableDocker: false
          testingFramework: vitest
          e2eFramework: playwright
          includeCoverage: true
          enableLinting: true
          enableFormatting: true
          enablePreCommitHooks: false
          errorTracking: none
          includeAnalytics: false
          apiUrl: http://localhost:3001/api/v1

    # 3. Fetch Node.js backend template into apps/backend
    - id: fetch-backend
      name: Add Node.js Backend
      action: fetch:template
      input:
        url: https://github.com/ikto-cma-cgm/backstage/tree/main/templates/application/node-service-template/skeleton
        targetPath: ./apps/backend
        values:
          name: ${{ parameters.name }}-backend
          description: Backend for ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: 3001
          nodeVersion: '20.x'
          includeDatabase: true
          includeRedis: false
          enableCICD: false
          enableDocker: false
          enablePrometheus: true
          enableGrafana: false
          enableSentry: false
          logLevel: info

    # 4. Fetch SonarQube configuration
    - id: fetch-sonarqube
      name: Add SonarQube Quality Scanner
      action: fetch:template
      input:
        url: https://github.com/ikto-cma-cgm/backstage/tree/main/templates/quality/sonarqube-scanner-template/skeleton
        values:
          projectKey: ${{ parameters.name }}
          projectName: ${{ parameters.name }}
          projectVersion: '1.0.0'
          projectType: fullstack
          sourceEncoding: UTF-8
          qualityGate: balanced
          minCoverage: 80
          minDuplication: 3
          blockOnFailure: true
          enableSecurityHotspots: true
          enableBranchAnalysis: false
          enablePRDecoration: true
          scanOnPR: true
          scanOnPush: true
          serviceMode: ephemeral

    # 5. Fetch WebdriverIO configuration
    - id: fetch-webdriverio
      name: Add WebdriverIO E2E Testing
      action: fetch:template
      input:
        url: https://github.com/ikto-cma-cgm/backstage/tree/qes-lab/templates/quality/webdriverio-template/skeleton
        values:
          projectName: ${{ parameters.name }}
          baseUrl: 'http://localhost:3000'
          testTimeout: 60000
          testType: e2e
          testFramework: mocha
          includePageObjects: true
          browsers:
            - chrome
          headless: true
          browserVersion: 'latest'
          executionMode: docker
          parallelExecution: true
          maxInstances: 5
          dockerizeRunner: true
          reporters:
            - spec
            - allure
            - junit
          enableScreenshots: true
          enableVideo: false
          runOnPR: true
          runOnPush: true
          runScheduled: false
          scheduleCron: '0 2 * * *'

    # 6. Publish to GitHub
    - id: publish
      name: Publish Monorepo to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private
        deleteBranchOnMerge: true
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        topics:
          - fullstack
          - monorepo
          - react
          - nodejs
          - backstage
          - ${{ parameters.name }}

    # 7. Register in Backstage catalog
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl | replace('/tree/', '/blob/') }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
        icon: github

      - title: Open in Backstage Catalog
        url: ${{ steps.register.output.catalogInfoUrl }}
        icon: catalog

      - title: Clone Repository
        url: ${{ steps.publish.output.cloneUrl }}
        icon: download

      - title: View CI/CD Pipeline
        url: ${{ steps.publish.output.remoteUrl }}/actions
        icon: build

    text:
      - title: Next Steps
        content: |
          Your new full-stack monorepo **${{ parameters.name }}** has been created successfully!

          ## What's Included

          | Feature | Configuration |
          |---------|---------------|
          | Frontend | React/Next.js on port 3000 |
          | Backend | Node.js/Express on port 3001 |
          | Node.js | v20.x (LTS) |
          | Database | PostgreSQL |
          | CI/CD | GitHub Actions |
          | Docker | Enabled |
          | Quality | SonarQube (balanced) |
          | E2E Tests | WebdriverIO (Chrome) |

          ## Quick Start

          ```bash
          git clone ${{ steps.publish.output.cloneUrl }}
          cd ${{ parameters.name }}
          npm install
          npm run dev
          ```

          Then open:
          - Frontend: http://localhost:3000
          - Backend API: http://localhost:3001/api/v1

          ## Need More Control?

          Use the **Full-Stack Web Service (Advanced)** template for full configuration options.
