apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-template
  title: Go Service
  description: Scaffolds a Go microservice with Gin, structured logging, health checks, structured config, and unit tests. Production-ready backend for CMA CGM Developer Portal.
  tags:
    - application
    - go
    - backend
    - microservice
spec:
  owner: group:platform-team
  type: service
  steps:
    - id: fetch-skeleton
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}

    - id: publish-repo
      name: Publish repository
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: github.com?owner=cma-cgm&repo=${{ parameters.name }}
        description: ${{ parameters.description }}

    - id: register-catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-repo'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  parameters:
    - title: Service identity
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          description: Kebab-case name for the Go microservice
          ui:help: 'Kebab-case, unique dans le Catalog. Ex: quote-pricing-api'
        description:
          title: Description
          type: string
          description: Une phrase décrivant le service Go
          ui:help: 'Une phrase décrivant le service. Apparaîtra dans le Catalog.'
        owner:
          title: Owner
          type: string
          description: Équipe responsable du service
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Équipe responsable. Sera paginée en cas d''incident.'

    - title: Catalog placement
      required:
        - system
        - domain
      properties:
        system:
          title: System
          type: string
          description: System Backstage du service
          ui:help: 'System Backstage auquel ce service appartient. Ex: pricing'
        domain:
          title: Domain
          type: string
          description: Domain métier
          ui:help: 'Domain métier. Ex: finance, shipping, platform'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish-repo'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        url: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: Next Steps
        content: |
          Service Go **${{ parameters.name }}** créé avec succès.

          Stack technique :
          - Go 1.21+ avec modules
          - Gin pour le HTTP framework
          - Structured logging avec slog
          - Health checks (/health, /ready)
          - Configuration via variables d'environnement
          - Tests unitaires avec testing standard

          1. Clone : `git clone ${{ steps['publish-repo'].output.remoteUrl }}`
          2. Install : `go mod download`
          3. Démarre : `go run cmd/main.go`
          4. Tests : `go test ./...`
          5. Lint : `golangci-lint run`
          6. Configure les secrets dans le repo Settings
          7. Le pipeline CI démarre automatiquement sur le premier push
